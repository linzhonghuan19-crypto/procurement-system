<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海外仓总采购表</title>
<style>
:root {
  --primary: #4a6cf7;
  --primary-hover: #3b5de7;
  --primary-light: #eef1ff;
  --success: #22c55e;
  --warning: #f59e0b;
  --danger: #ef4444;
  --gray-50: #f8f9fa;
  --gray-100: #f0f1f3;
  --gray-150: #e8eaed;
  --gray-200: #dadce0;
  --gray-300: #bdc1c6;
  --gray-400: #9aa0a6;
  --gray-500: #80868b;
  --gray-600: #5f6368;
  --gray-700: #3c4043;
  --gray-800: #202124;
  --header-bg: #f0f1f3;
  --selected-bg: #e8f0fe;
  --selected-border: #1a73e8;
  --gridline: #e0e0e0;
  --header-h: 32px;
  --row-h: 28px;
  --ribbon-h: 36px;
  --toolbar-h: 82px;
  --formula-h: 36px;
  --status-h: 28px;
  --col-w: 120px;
  --row-num-w: 50px;
  --tab-active-border: #1a73e8;
  --tab-hover-bg: #f0f1f3;
  --ribbon-group-gap: 4px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif; font-size: 13px; color: var(--gray-800); background: #fff; overflow: hidden; height: 100vh; user-select: none; }
input, textarea, select, button { font-family: inherit; font-size: 13px; }
a { color: var(--primary); text-decoration: none; }

/* ===== LOGIN ===== */
.login-page { display: flex; align-items: center; justify-content: center; height: 100vh; background: #f0f2f5; }
.login-card { background: #fff; border-radius: 12px; padding: 36px; width: 380px; box-shadow: 0 2px 16px rgba(0,0,0,0.08); }
.login-card h1 { font-size: 20px; text-align: center; margin-bottom: 4px; color: var(--gray-800); }
.login-card .subtitle { text-align: center; color: var(--gray-500); font-size: 13px; margin-bottom: 24px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 12px; font-weight: 500; color: var(--gray-600); margin-bottom: 4px; }
.form-group input { width: 100%; padding: 10px 12px; border: 1px solid var(--gray-200); border-radius: 8px; font-size: 14px; }
.form-group input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(74,108,247,0.1); }
.form-group select { width: 100%; padding: 8px 10px; border: 1px solid var(--gray-200); border-radius: 6px; font-size: 13px; background: #fff; }
.form-group textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--gray-200); border-radius: 6px; font-size: 13px; resize: vertical; font-family: inherit; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 18px; border-radius: 6px; font-weight: 500; font-size: 13px; border: none; cursor: pointer; transition: all 0.15s; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-outline { background: transparent; border: 1px solid var(--gray-200); color: var(--gray-600); }
.btn-outline:hover { background: var(--gray-50); border-color: var(--gray-300); }
.btn-success { background: var(--success); color: #fff; }
.btn-success:hover { background: #16a34a; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: #dc2626; }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-block { width: 100%; padding: 10px; }
.btn-link { background: none; border: none; color: var(--primary); cursor: pointer; font-size: 12px; padding: 0; }
.btn-link:hover { text-decoration: underline; }
.btn-icon { background: none; border: none; padding: 4px 6px; border-radius: 4px; cursor: pointer; color: var(--gray-500); font-size: 16px; line-height: 1; }
.btn-icon:hover { background: var(--gray-100); color: var(--gray-700); }
.hidden { display: none !important; }

/* ===== SPREADSHEET LAYOUT ===== */
.spreadsheet-app { display: none; height: 100vh; flex-direction: column; }
.spreadsheet-app.active { display: flex; }

/* ===== TOP BAR (document title + tabs) ===== */
.top-bar { display: flex; align-items: center; height: 40px; padding: 0 12px; border-bottom: 1px solid var(--gray-200); background: #fff; flex-shrink: 0; gap: 8px; }
.top-bar .doc-title { font-size: 15px; font-weight: 500; color: var(--gray-800); padding: 4px 8px; border-radius: 4px; cursor: default; white-space: nowrap; }
.top-bar .doc-title:hover { background: var(--gray-100); }
.top-bar .doc-title input { display: none; border: none; font-size: 15px; font-weight: 500; outline: none; background: var(--gray-100); padding: 2px 4px; border-radius: 2px; }
.top-bar .doc-title.editing input { display: inline; }
.top-bar .doc-title.editing span { display: none; }
.top-bar .star { color: var(--gray-300); cursor: pointer; font-size: 16px; padding: 4px; }
.top-bar .star:hover, .top-bar .star.active { color: var(--warning); }
.top-bar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.top-bar-tabs { display: flex; align-items: center; gap: 0; margin-left: 16px; }
.top-bar-tab { padding: 8px 14px; font-size: 13px; color: var(--gray-600); cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.15s; white-space: nowrap; }
.top-bar-tab:hover { background: var(--tab-hover-bg); }
.top-bar-tab.active { color: var(--selected-border); border-bottom-color: var(--tab-active-border); font-weight: 500; }
.user-avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 12px; cursor: pointer; }
.user-avatar:hover { opacity: 0.8; }

/* ===== RIBBON TOOLBAR ===== */
.ribbon { display: none; flex-direction: column; height: var(--toolbar-h); padding: 2px 8px; border-bottom: 1px solid var(--gray-200); background: #fff; flex-shrink: 0; overflow: hidden; }
.ribbon.active { display: flex; }
.ribbon-row { display: flex; align-items: center; gap: 0; flex: 1; min-height: 0; }
.ribbon-row:first-child { border-bottom: 1px solid var(--gray-100); }
.ribbon-group { display: flex; align-items: center; gap: 1px; flex-shrink: 0; padding: 0 4px; }
.ribbon-group-title { font-size: 8px; color: var(--gray-400); text-align: center; position: absolute; bottom: 0; left: 0; right: 0; pointer-events: none; white-space: nowrap; }
.ribbon-btn { padding: 1px 4px; border-radius: 3px; cursor: pointer; color: var(--gray-600); font-size: 11px; border: none; background: none; display: flex; flex-direction: column; align-items: center; gap: 0; white-space: nowrap; min-width: 32px; position: relative; padding-bottom: 10px; height: 36px; justify-content: center; }
.ribbon-btn:hover { background: var(--gray-100); }
.ribbon-btn .ribbon-icon { font-size: 14px; line-height: 1.2; }
.ribbon-btn .ribbon-label { font-size: 8px; color: var(--gray-500); line-height: 1.1; }
.ribbon-btn .ribbon-label-sm { font-size: 7px; color: var(--gray-400); }
.ribbon-sep { width: 1px; height: 24px; background: var(--gray-200); margin: 0 2px; flex-shrink: 0; }
.ribbon-select-wrap { display: flex; align-items: center; gap: 1px; }
.ribbon select { padding: 1px 2px; border: 1px solid var(--gray-200); border-radius: 3px; font-size: 10px; background: #fff; cursor: pointer; height: 20px; max-width: 64px; }
.ribbon select:hover { border-color: var(--gray-300); }
.ribbon select:focus { outline: none; border-color: var(--primary); }
.ribbon .color-picker-wrap { position: relative; display: inline-flex; }
.ribbon .color-picker-wrap input[type="color"] { position: absolute; opacity: 0; width: 100%; height: 100%; cursor: pointer; top: 0; left: 0; }
.ribbon-right { margin-left: auto; display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.ribbon-btn.active { background: var(--primary-light); color: var(--primary); }
.ribbon .btn-text { background: none; border: none; padding: 2px 6px; border-radius: 3px; cursor: pointer; font-size: 10px; color: var(--gray-600); display: flex; align-items: center; gap: 2px; }
.ribbon .btn-text:hover { background: var(--gray-100); }

/* ===== FORMULA BAR ===== */
.formula-bar { display: flex; align-items: center; height: var(--formula-h); border-bottom: 1px solid var(--gray-200); background: #fff; flex-shrink: 0; }
.formula-bar .cell-ref { width: 60px; text-align: center; font-size: 12px; font-weight: 600; color: var(--gray-600); border-right: 1px solid var(--gray-200); height: 100%; display: flex; align-items: center; justify-content: center; background: var(--gray-50); }
.formula-bar .fx { padding: 0 8px; color: var(--gray-400); font-size: 12px; font-style: italic; }
.formula-bar .formula-input { flex: 1; height: 100%; border: none; outline: none; padding: 0 8px; font-size: 13px; }

/* ===== FILTER TOOLBAR ===== */
.filter-toolbar { display: flex; align-items: center; gap: 8px; padding: 4px 12px; border-bottom: 1px solid var(--gray-200); background: #fff; flex-shrink: 0; min-height: 36px; }
.filter-toolbar .search-input { flex: 1; max-width: 300px; padding: 4px 10px; border: 1px solid var(--gray-200); border-radius: 16px; font-size: 12px; outline: none; }
.filter-toolbar .search-input:focus { border-color: var(--primary); }
.filter-toolbar .filter-tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; background: var(--primary-light); color: var(--primary); border-radius: 12px; font-size: 11px; cursor: pointer; }
.filter-toolbar .filter-tag .remove { font-size: 14px; line-height: 1; cursor: pointer; }
.filter-toolbar .filter-tag .remove:hover { color: var(--danger); }
.filter-toolbar .filter-count { font-size: 11px; color: var(--gray-500); margin-left: auto; white-space: nowrap; }

/* ===== GRID ===== */
.grid-container { flex: 1; overflow: auto; overflow-y: auto; position: relative; min-height: 0; scroll-behavior: auto; will-change: scroll-position; }
.grid-scroll { min-width: 100%; }
.grid-table { border-collapse: collapse; width: max-content; }
.grid-table th.col-header { 
  background: var(--header-bg); 
  border-right: 1px solid var(--gridline); 
  border-bottom: 1px solid var(--gray-300); 
  height: var(--header-h); 
  padding: 0; 
  text-align: center; 
  font-size: 11px; 
  font-weight: 500; 
  color: var(--gray-500); 
  position: sticky; 
  top: 0; 
  z-index: 3; 
  min-width: var(--col-w);
  max-width: var(--col-w);
  width: var(--col-w);
}
.grid-table th.col-header:first-child { 
  min-width: var(--row-num-w); 
  max-width: var(--row-num-w); 
  width: var(--row-num-w); 
  z-index: 4; 
  left: 0; 
  position: sticky;
}
.grid-table th.col-header .resize-handle { 
  position: absolute; right: 0; top: 0; bottom: 0; width: 4px; cursor: col-resize; 
}
.grid-table th.col-header .resize-handle:hover { background: var(--selected-border); }
.grid-table th.col-header .filter-icon { 
  font-size: 10px; margin-left: 2px; opacity: 0.4; cursor: pointer; 
  display: inline-block; vertical-align: middle;
}
.grid-table th.col-header .filter-icon:hover { opacity: 1; }
.grid-table th.col-header .sort-indicator { display: inline-block; font-size: 10px; margin-left: 2px; opacity: 0.5; vertical-align: middle; }
.grid-table th.col-header .sort-indicator.active { opacity: 1; }
.grid-table th.col-header.sorted { background: var(--selected-bg) !important; }
.grid-table td.row-num { 
  background: var(--header-bg); 
  border-right: 1px solid var(--gray-300); 
  border-bottom: 1px solid var(--gridline); 
  text-align: center; 
  font-size: 11px; 
  color: var(--gray-500); 
  padding: 0; 
  min-width: var(--row-num-w); 
  max-width: var(--row-num-w); 
  width: var(--row-num-w); 
  height: var(--row-h);
  position: sticky;
  left: 0;
  z-index: 2;
}
.grid-table td.row-num.selected-row { background: var(--selected-bg); color: var(--selected-border); font-weight: 600; }
.grid-table td.cell { 
  border-right: 1px solid var(--gridline); 
  border-bottom: 1px solid var(--gridline); 
  padding: 0; 
  height: var(--row-h); 
  min-width: var(--col-w);
  max-width: var(--col-w);
  width: var(--col-w);
  position: relative;
  cursor: cell;
}
.grid-table td.cell .cell-content { 
  padding: 0 6px; 
  line-height: var(--row-h); 
  overflow: hidden; 
  text-overflow: ellipsis; 
  white-space: nowrap;
  font-size: 13px;
  height: 100%;
}
.grid-table td.cell.selected { 
  outline: 2px solid var(--selected-border); 
  outline-offset: -1px;
  z-index: 1;
}
.grid-table td.cell .cell-content.editing { display: none; }
.grid-table td.cell .cell-edit { 
  display: none; 
  position: absolute; 
  inset: 0; 
  border: none; 
  outline: none; 
  padding: 0 6px; 
  font-size: 13px;
  font-family: inherit;
  z-index: 5;
}
.grid-table td.cell .cell-edit.active { display: block; }
.grid-table td.cell .cell-content.num { text-align: right; }
.grid-table td.cell .cell-content.link { color: var(--primary); cursor: pointer; }
.grid-table td.cell .cell-content.link:hover { text-decoration: underline; }
.grid-table td.cell .cell-content.status { font-size: 12px; font-weight: 500; }
.grid-table td.cell .cell-content .status-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
.grid-table td.cell .cell-content .img-thumb { width: 24px; height: 24px; object-fit: cover; border-radius: 2px; vertical-align: middle; cursor: pointer; }
.grid-table td.cell .cell-content .img-thumb:hover { transform: scale(1.2); }
.grid-table td.cell .cell-content .cell-link { color: var(--primary); cursor: pointer; font-size: 12px; }
.grid-table td.cell .cell-content .cell-link:hover { text-decoration: underline; }
.grid-table td.cell.highlight-col { background: #f0f4ff !important; }
.grid-table td.cell.highlight-row { background: #fff8e1 !important; }
.status-pending { color: #b45309; }
.status-ordered { color: #1e40af; }
.status-transit { color: #6d28d9; }
.status-warehoused { color: #065f46; }
.status-discontinued { color: var(--gray-400); }
.grid-table tr.abs-row-even td.cell { background: #fafafa; }
.grid-table tr.abs-row-even td.row-num { background: var(--header-bg); }
.grid-table tr.abs-row-odd td.cell { background: #fff; }
.grid-table tr.abs-row-odd td.row-num { background: #f5f6f8; }
.grid-table tr.abs-row-odd:hover td.cell, .grid-table tr.abs-row-even:hover td.cell { background: #f5f8ff; }
.grid-table tr.abs-row-odd:hover td.row-num, .grid-table tr.abs-row-even:hover td.row-num { background: #e8ecf4; }
.grid-table .v-spacer { pointer-events: none; }
.grid-table .v-spacer td { border: none; padding: 0; height: 100%; }

/* ===== STATUS BAR ===== */
.status-bar { 
  display: flex; 
  align-items: center; 
  height: var(--status-h); 
  border-top: 1px solid var(--gray-200); 
  background: #fff; 
  padding: 0 12px; 
  font-size: 11px; 
  color: var(--gray-500); 
  gap: 16px;
  flex-shrink: 0;
}
.status-bar .sheet-tabs { display: flex; align-items: center; gap: 0; margin-left: -12px; }
.status-bar .sheet-tab { 
  padding: 2px 16px; 
  border-right: 1px solid var(--gray-200); 
  cursor: pointer; 
  font-size: 12px; 
  color: var(--gray-500); 
  height: var(--status-h); 
  display: flex; 
  align-items: center;
}
.status-bar .sheet-tab.active { 
  border-bottom: 2px solid var(--primary); 
  color: var(--primary); 
  font-weight: 500; 
}
.status-bar .sheet-tab:hover { background: var(--gray-50); }
.status-bar .status-right { margin-left: auto; display: flex; gap: 16px; }

/* ===== TOAST ===== */
.toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(20px); z-index: 9999; padding: 10px 20px; border-radius: 8px; color: #fff; font-size: 13px; font-weight: 500; box-shadow: 0 4px 16px rgba(0,0,0,0.15); opacity: 0; transition: all 0.3s; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }
.toast.info { background: var(--primary); }

/* ===== MODAL ===== */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 1000; align-items: center; justify-content: center; }
.modal-overlay.active { display: flex; }
.modal { background: #fff; border-radius: 12px; width: 90%; max-width: 700px; max-height: 85vh; overflow: auto; box-shadow: 0 8px 32px rgba(0,0,0,0.12); }
.modal-wide { max-width: 900px; }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--gray-200); }
.modal-header h3 { font-size: 15px; font-weight: 600; }
.modal-close { background: none; border: none; font-size: 20px; color: var(--gray-400); padding: 4px; cursor: pointer; }
.modal-close:hover { color: var(--gray-600); }
.modal-body { padding: 20px; }
.modal-footer { padding: 12px 20px; border-top: 1px solid var(--gray-200); display: flex; justify-content: flex-end; gap: 8px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.form-row-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px; }

/* ===== DROPDOWN ===== */
.dropdown { position: relative; display: inline-block; }
.dropdown-menu { display: none; position: absolute; top: 100%; right: 0; background: #fff; border: 1px solid var(--gray-200); border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.1); z-index: 100; min-width: 180px; padding: 4px; }
.dropdown-menu.show { display: block; }
.dropdown-menu.dropdown-left { right: auto; left: 0; }
.dropdown-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; color: var(--gray-700); }
.dropdown-item:hover { background: var(--gray-50); }
.dropdown-item .item-icon { width: 20px; text-align: center; font-size: 14px; }
.dropdown-sep { height: 1px; background: var(--gray-200); margin: 4px 0; }

/* ===== CELL DROPDOWN (edit mode) ===== */
.cell-select-edit { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 2px solid var(--primary); border-radius: 0; background: #fff; font-size: 13px; padding: 0 4px; outline: none; z-index: 5; cursor: default; }
.cell-select-edit.active { display: block; }
.cell-select-edit option { padding: 4px; }

/* ===== COLUMN FILTER POPUP ===== */
.col-filter-popup { position: fixed; background: #fff; border: 1px solid var(--gray-200); border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); z-index: 1000; min-width: 220px; max-width: 320px; max-height: 360px; display: flex; flex-direction: column; }
.col-filter-popup .popup-header { padding: 8px 12px; border-bottom: 1px solid var(--gray-200); font-size: 12px; font-weight: 600; color: var(--gray-700); display: flex; justify-content: space-between; align-items: center; }
.col-filter-popup .popup-header .clear-btn { font-size: 11px; color: var(--primary); cursor: pointer; }
.col-filter-popup .popup-search { padding: 6px 12px; border-bottom: 1px solid var(--gray-200); }
.col-filter-popup .popup-search input { width: 100%; padding: 4px 8px; border: 1px solid var(--gray-200); border-radius: 4px; font-size: 12px; outline: none; }
.col-filter-popup .popup-list { overflow-y: auto; flex: 1; padding: 4px 0; }
.col-filter-popup .popup-list label { display: flex; align-items: center; gap: 6px; padding: 4px 12px; font-size: 12px; cursor: pointer; }
.col-filter-popup .popup-list label:hover { background: var(--gray-50); }
.col-filter-popup .popup-list label input { cursor: pointer; }
.col-filter-popup .popup-footer { padding: 8px 12px; border-top: 1px solid var(--gray-200); display: flex; gap: 8px; justify-content: flex-end; }

/* ===== SIDEBAR PANEL ===== */
.sidebar-panel { display: none; position: fixed; right: 0; top: 0; bottom: 0; width: 420px; background: #fff; box-shadow: -4px 0 24px rgba(0,0,0,0.1); z-index: 200; flex-direction: column; }
.sidebar-panel.active { display: flex; }
.sidebar-panel .panel-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--gray-200); }
.sidebar-panel .panel-header h3 { font-size: 15px; }
.sidebar-panel .panel-body { flex: 1; overflow: auto; padding: 20px; }
.sidebar-panel .panel-body .form-group { margin-bottom: 20px; }
.sidebar-panel .panel-body .form-group label { font-size: 12px; font-weight: 600; color: var(--gray-600); margin-bottom: 6px; display: block; }
.sidebar-panel .panel-body .form-group input, .sidebar-panel .panel-body .form-group textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--gray-200); border-radius: 6px; font-size: 13px; }
.sidebar-panel .panel-body .form-group textarea { font-family: monospace; }

/* ===== LOADING ===== */
.loading { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--gray-200); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== DASHBOARD ===== */
.dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
.dashboard-card { background: #fff; border: 1px solid var(--gray-200); border-radius: 8px; padding: 16px; }
.dashboard-card h4 { font-size: 13px; color: var(--gray-600); margin-bottom: 8px; font-weight: 500; }
.dashboard-card .stat-value { font-size: 28px; font-weight: 700; color: var(--gray-800); }
.dashboard-card .stat-label { font-size: 11px; color: var(--gray-400); margin-top: 2px; }
.dashboard-card .stat-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 12px; }
.dashboard-card .stat-row .stat-name { color: var(--gray-600); }
.dashboard-card .stat-row .stat-val { font-weight: 500; }
.dashboard-card .stat-row.danger .stat-val { color: var(--danger); }
.dashboard-card .chart-container { width: 100%; height: 180px; }

/* ===== COLLECT FORM ===== */
.collect-form-preview { background: var(--gray-50); border: 1px solid var(--gray-200); border-radius: 8px; padding: 20px; margin-top: 12px; }
.collect-form-preview .cf-field { margin-bottom: 12px; }
.collect-form-preview .cf-field label { display: block; font-size: 12px; font-weight: 500; color: var(--gray-600); margin-bottom: 4px; }

/* ===== DATA GROUPING ===== */
.group-selector { margin-bottom: 16px; }
.group-selector select { padding: 6px 10px; border: 1px solid var(--gray-200); border-radius: 6px; font-size: 13px; }
.group-list { }
.group-item { border: 1px solid var(--gray-200); border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
.group-item .group-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; cursor: pointer; background: var(--gray-50); }
.group-item .group-header:hover { background: var(--gray-100); }
.group-item .group-header .group-name { font-weight: 600; font-size: 13px; }
.group-item .group-header .group-stats { font-size: 11px; color: var(--gray-500); }
.group-item .group-body { display: none; padding: 8px 14px; border-top: 1px solid var(--gray-200); }
.group-item .group-body.open { display: block; }
.group-item .group-body table { width: 100%; font-size: 12px; border-collapse: collapse; }
.group-item .group-body table th { text-align: left; padding: 4px 6px; color: var(--gray-500); font-weight: 500; border-bottom: 1px solid var(--gray-200); }
.group-item .group-body table td { padding: 4px 6px; border-bottom: 1px solid var(--gray-100); }

/* ===== NOTIFICATION SETTINGS ===== */
.notif-toggle { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; }
.notif-toggle .toggle-label { font-size: 13px; }
.switch { position: relative; width: 40px; height: 22px; display: inline-block; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch .slider { position: absolute; cursor: pointer; inset: 0; background: var(--gray-300); border-radius: 22px; transition: 0.3s; }
.switch .slider:before { content: ""; position: absolute; height: 18px; width: 18px; left: 2px; bottom: 2px; background: #fff; border-radius: 50%; transition: 0.3s; }
.switch input:checked + .slider { background: var(--primary); }
.switch input:checked + .slider:before { transform: translateX(18px); }

/* ===== AI CLASSIFICATION ===== */
.ai-classify-result { background: var(--gray-50); border: 1px solid var(--gray-200); border-radius: 8px; padding: 16px; margin-top: 12px; }
.ai-classify-result .result-section { margin-bottom: 12px; }
.ai-classify-result .result-section h5 { font-size: 12px; color: var(--gray-600); font-weight: 600; margin-bottom: 6px; }

/* ===== DATA PROTECTION ===== */
.protection-info { padding: 12px; background: var(--gray-50); border-radius: 6px; margin-bottom: 12px; }
.protection-info .info-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 12px; }

/* ===== PRINT STYLES ===== */
@media print {
  body { overflow: visible !important; background: #fff; }
  .top-bar, .ribbon, .formula-bar, .filter-toolbar, .status-bar, .modal-overlay, .sidebar-panel, .toast { display: none !important; }
  .grid-container { overflow: visible !important; }
  .grid-table th.col-header { position: static !important; }
  .grid-table td.row-num { position: static !important; }
  .grid-table td.cell { break-inside: avoid; }
  .spreadsheet-app.active { display: block !important; height: auto; }
  #gridView { display: block !important; }
  #ordersView, #aiView { display: none !important; }
}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--gray-50); }
::-webkit-scrollbar-thumb { background: var(--gray-300); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--gray-400); }

/* ===== MISC ===== */
.text-center { text-align: center; }
.text-muted { color: var(--gray-500); }
.mt-8 { margin-top: 8px; }
.mb-8 { margin-bottom: 8px; }
.mb-16 { margin-bottom: 16px; }
.flex { display: flex; }
.flex-1 { flex: 1; }
.gap-8 { gap: 8px; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.tag { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 11px; font-weight: 500; }
.tag-success { background: #d1fae5; color: #065f46; }
.tag-warning { background: #fef3c7; color: #92400e; }
.tag-danger { background: #fee2e2; color: #991b1b; }
.tag-info { background: #dbeafe; color: #1e40af; }
.tag-primary { background: var(--primary-light); color: var(--primary); }
.spinner-overlay { display: none; position: fixed; inset: 0; background: rgba(255,255,255,0.7); z-index: 9998; align-items: center; justify-content: center; }
.spinner-overlay.active { display: flex; }
.spinner { width: 36px; height: 36px; border: 3px solid var(--gray-200); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.6s linear infinite; }

/* ===== CONDITIONAL FORMATTING ===== */
.cf-preview { display: flex; align-items: center; gap: 8px; padding: 6px; border: 1px solid var(--gray-200); border-radius: 4px; margin: 4px 0; }
.cf-rule-item { background: var(--gray-50); border: 1px solid var(--gray-200); border-radius: 6px; padding: 10px; margin-bottom: 8px; }

/* ===== VERSION HISTORY ===== */
.vh-item { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--gray-100); font-size: 12px; }
.vh-item .vh-time { color: var(--gray-500); min-width: 140px; }
.vh-item .vh-user { color: var(--gray-600); min-width: 80px; }
.vh-item .vh-action { color: var(--gray-700); flex: 1; }

/* ===== DATA VALIDATION ===== */
.dv-rule { background: var(--gray-50); border: 1px solid var(--gray-200); border-radius: 6px; padding: 10px; margin-bottom: 8px; }

/* ===== FUNCTION LIST ===== */
.func-group { margin-bottom: 12px; }
.func-group-title { font-size: 12px; font-weight: 600; color: var(--gray-600); padding: 6px 0; border-bottom: 1px solid var(--gray-200); margin-bottom: 6px; }
.func-item { display: inline-flex; align-items: center; padding: 4px 10px; margin: 2px; border: 1px solid var(--gray-200); border-radius: 4px; font-size: 11px; cursor: pointer; }
.func-item:hover { background: var(--primary-light); border-color: var(--primary); }

/* ===== QUICK TOOLS ===== */
.qt-section { margin-bottom: 16px; }
.qt-section h4 { font-size: 13px; font-weight: 600; color: var(--gray-700); margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--gray-200); }
.qt-btn { padding: 6px 14px; border: 1px solid var(--gray-200); border-radius: 6px; background: #fff; cursor: pointer; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; margin: 2px; }
.qt-btn:hover { background: var(--gray-50); border-color: var(--gray-300); }
.qt-btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.qt-btn.primary:hover { background: var(--primary-hover); }

/* ===== FREEZE PANE INDICATOR ===== */
.freeze-line { position: absolute; z-index: 5; pointer-events: none; }
.freeze-line.col { top: 0; bottom: 0; width: 3px; background: var(--selected-border); cursor: col-resize; left: var(--col-w); }
.freeze-line.row { left: 0; right: 0; height: 3px; background: var(--selected-border); cursor: row-resize; top: var(--header-h); }
</style>

<script>
// ========== STATE ==========
let TOKEN = localStorage.getItem('token') || '';
let USER = JSON.parse(localStorage.getItem('user') || '{}');
let products = [];
let filteredProducts = [];
let orders = [];
let currentView = 'products';
let selectedCell = null;
let editingCell = null;
let colWidths = {};
let sortState = {};
let columnFilters = {};
let searchQuery = '';
let activeFilterPopup = null;
let isStarred = localStorage.getItem('docStarred') === 'true';
let cellStyles = {};
let currentRibbon = 'home';
let highlightRowCol = false;
let freezePanes = false;
let freezeCol = 0;
let freezeRow = 0;

const COLUMNS = [
  { key: 'row_num', label: '#', width: 50, editable: false },
  { key: 'date', label: '日期', width: 80, editable: true },
  { key: 'attribute', label: '属性', width: 70, editable: true },
  { key: 'category', label: '组别', width: 80, editable: true },
  { key: 'store', label: '店铺', width: 80, editable: true },
  { key: 'mercadolibre_link', label: '美客多产品链接', width: 180, editable: true, type: 'link' },
  { key: 'purchase_link', label: '原采购链接', width: 180, editable: true, type: 'link' },
  { key: 'sku', label: 'SKU', width: 140, editable: true },
  { key: 'product_name', label: '标题', width: 220, editable: true },
  { key: 'product_attributes', label: '产品属性', width: 120, editable: true },
  { key: 'purchase_remarks', label: '采购备注', width: 120, editable: true },
  { key: 'purchase_quantity', label: '采购数量', width: 80, editable: true, type: 'number' },
  { key: 'warehouse_remarks', label: '仓库备注', width: 120, editable: true },
  { key: 'order_number', label: '订单号', width: 160, editable: true },
  { key: 'purchase_price', label: '采购价RMB', width: 100, editable: true, type: 'number' },
  { key: 'new_purchase_price', label: '新采购价RMB', width: 100, editable: true, type: 'number' },
  { key: 'new_purchase_link', label: '新采购链接', width: 180, editable: true, type: 'link' },
  { key: 'supplier', label: '供应商', width: 140, editable: true },
  { key: 'image_url', label: '图片', width: 70, editable: true, type: 'image' },
  { key: 'stock_quantity', label: '库存', width: 70, editable: true, type: 'number' },
  { key: 'remark1', label: '备注1', width: 120, editable: true },
  { key: 'remark2', label: '备注2', width: 120, editable: true },
  { key: 'remark3', label: '备注3', width: 120, editable: true },
  { key: 'remark4', label: '备注4', width: 120, editable: true },
  { key: 'length', label: '长', width: 70, editable: true, type: 'number' },
  { key: 'width', label: '宽', width: 70, editable: true, type: 'number' },
  { key: 'height', label: '高', width: 70, editable: true, type: 'number' },
];

// ========== DROPDOWN OPTIONS STORAGE ==========
// columnKey -> { options: string[], allowCustom: boolean }
const columnDropdowns = {};
function loadDropdownOptions() {
  try {
    const saved = JSON.parse(localStorage.getItem('columnDropdowns') || '{}');
    Object.assign(columnDropdowns, saved);
  } catch(e) { /* ignore */ }
}
function persistDropdownOptions() {
  localStorage.setItem('columnDropdowns', JSON.stringify(columnDropdowns));
}
loadDropdownOptions();

// ========== AUTH ==========
function doLogin() {
  const u = document.getElementById('loginUsername').value;
  const p = document.getElementById('loginPassword').value;
  fetch('/api/auth/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:u, password:p})})
  .then(r=>r.json()).then(d=>{
    if (d.token) {
      TOKEN = d.token; USER = d.user;
      localStorage.setItem('token', TOKEN); localStorage.setItem('user', JSON.stringify(USER));
      showApp();
    } else toast(d.detail||'登录失败', 'error');
  }).catch(()=>toast('网络错误', 'error'));
}

function doRegister() {
  const u = document.getElementById('regUsername').value;
  const p = document.getElementById('regPassword').value;
  const n = document.getElementById('regDisplayName').value || u;
  fetch('/api/auth/register', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:u, password:p, display_name:n})})
  .then(r=>r.json()).then(d=>{
    if (d.token) { TOKEN = d.token; USER = d.user; localStorage.setItem('token', TOKEN); localStorage.setItem('user', JSON.stringify(USER)); showApp(); }
    else toast(d.detail||'注册失败', 'error');
  });
}

function doLogout() {
  localStorage.removeItem('token'); localStorage.removeItem('user');
  TOKEN = ''; USER = {};
  document.getElementById('app').classList.remove('active');
  document.getElementById('loginPage').style.display = 'flex';
  closeSidebar();
}

function showRegister() { document.getElementById('loginForm').style.display='none'; document.getElementById('registerForm').style.display='block'; }
function showLogin() { document.getElementById('loginForm').style.display='block'; document.getElementById('registerForm').style.display='none'; }

function authHeaders() {
  return TOKEN ? {'Authorization': 'Bearer '+TOKEN, 'Content-Type': 'application/json'} : {'Content-Type': 'application/json'};
}

// ========== APP ==========
function showApp() {
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('app').classList.add('active');
  const n = USER.display_name || USER.username;
  document.getElementById('userAvatar').textContent = n ? n[0] : 'U';
  document.getElementById('userStatus').textContent = n;
  if (isStarred) document.getElementById('starBtn').innerHTML = '&#9733;';
  loadData();
}

function toggleStar() {
  isStarred = !isStarred;
  document.getElementById('starBtn').innerHTML = isStarred ? '&#9733;' : '&#9734;';
  localStorage.setItem('docStarred', isStarred);
  toast(isStarred ? '已标记星标' : '已取消星标', 'info');
}

function toggleUserMenu() {
  document.getElementById('userMenu').classList.toggle('show');
}
document.addEventListener('click', function(e) {
  const dd = document.getElementById('userMenuDropdown');
  if (dd && !dd.contains(e.target)) {
    document.getElementById('userMenu').classList.remove('show');
  }
});

function renameDoc(val) {
  if (val.trim()) document.querySelector('#docTitle span').textContent = val.trim();
}

// ========== RIBBON SWITCH ==========
function switchRibbon(tab) {
  currentRibbon = tab;
  document.querySelectorAll('.top-bar-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.querySelectorAll('.ribbon').forEach(r => r.classList.toggle('active', r.id === 'ribbon-' + tab));
}

// ========== DATA ==========
async function loadData() {
  try {
    document.getElementById('lastSync').textContent = '同步中...';
    const data = await api('/api/products?page_size=10000');
    products = data.items || [];
    document.getElementById('rowCount').textContent = products.length;
    applyFilters();
    document.getElementById('lastSync').textContent = '最后更新: '+new Date().toLocaleTimeString();
  } catch(e) {
    toast('加载失败: '+e.message, 'error');
    document.getElementById('lastSync').textContent = '同步失败';
  }
}

function refreshData() { loadData(); }

// ========== API ==========
async function api(url, method='GET', body=null) {
  const opts = {method, headers: authHeaders()};
  if (body) opts.body = JSON.stringify(body);
  const resp = await fetch(url, opts);
  if (resp.status === 401) {
    localStorage.removeItem('token'); localStorage.removeItem('user');
    TOKEN = ''; USER = {};
    if (document.getElementById('app').classList.contains('active')) {
      document.getElementById('app').classList.remove('active');
      document.getElementById('loginPage').style.display = 'flex';
    }
    throw new Error('请先登录');
  }
  const data = await resp.json();
  if (!resp.ok) throw new Error(data.detail || '请求失败');
  return data;
}

// ========== FILTERING & SORTING ==========
function applyFilters() {
  searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
  let result = [...products];
  if (searchQuery) {
    const searchableCols = COLUMNS.filter(c => c.key !== 'row_num' && c.key !== 'image_url');
    result = result.filter(p => searchableCols.some(col => {
      const val = p[col.key];
      return val !== null && val !== undefined && String(val).toLowerCase().includes(searchQuery);
    }));
  }
  Object.keys(columnFilters).forEach(colKey => {
    const selectedValues = columnFilters[colKey];
    if (selectedValues && selectedValues.size > 0) {
      result = result.filter(p => {
        const val = String(p[colKey] || '').trim();
        return selectedValues.has(val);
      });
    }
  });
  const sortKey = Object.keys(sortState).find(k => sortState[k] !== null);
  if (sortKey) {
    const dir = sortState[sortKey] === 'asc' ? 1 : -1;
    result.sort((a, b) => {
      const va = a[sortKey] !== null && a[sortKey] !== undefined ? a[sortKey] : '';
      const vb = b[sortKey] !== null && b[sortKey] !== undefined ? b[sortKey] : '';
      if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * dir;
      return String(va).localeCompare(String(vb), 'zh-CN') * dir;
    });
  }
  filteredProducts = result;
  updateFilterTags();
  renderGrid();
  document.getElementById('filterCount').textContent = '显示 '+result.length+'/'+products.length+' 条';
}

function toggleSort(colKey) {
  if (sortState[colKey] === 'asc') sortState[colKey] = 'desc';
  else if (sortState[colKey] === 'desc') sortState[colKey] = null;
  else { Object.keys(sortState).forEach(k => sortState[k] = null); sortState[colKey] = 'asc'; }
  applyFilters();
}

function showColumnFilter(colIdx, event) {
  event.stopPropagation();
  closeFilterPopup();
  const col = COLUMNS[colIdx];
  if (col.key === 'row_num') return;
  const valueSet = new Set();
  products.forEach(p => { valueSet.add(String(p[col.key] || '').trim() || '(空白)'); });
  const values = Array.from(valueSet).sort();
  const selectedSet = columnFilters[col.key] || new Set();
  const popup = document.createElement('div');
  popup.className = 'col-filter-popup';
  popup.id = 'activeFilterPopup';
  popup.innerHTML = '<div class="popup-header"><span>筛选: '+col.label+'</span><span class="clear-btn" onclick="clearColumnFilter(\''+col.key+'\')">清除</span></div><div class="popup-search"><input type="text" placeholder="搜索..." oninput="filterPopupList(this.value)" onkeydown="event.stopPropagation()"></div><div class="popup-list" id="popupList"><label><input type="checkbox" onchange="toggleSelectAll(this)" '+(selectedSet.size===0||selectedSet.size===values.length?'checked':'')+'> 全选 ('+values.length+')</label>'+values.map(v => '<label><input type="checkbox" value="'+escHtml(v)+'" '+(selectedSet.has(v)||selectedSet.size===0?'checked':'')+' onchange="onFilterCheckChange(\''+col.key+'\', this)"> '+escHtml(v)+'</label>').join('')+'</div><div class="popup-footer"><button class="btn btn-sm btn-outline" onclick="closeFilterPopup()">取消</button><button class="btn btn-sm btn-primary" onclick="confirmFilter(\''+col.key+'\')">确定</button></div>';
  document.body.appendChild(popup);
  const th = document.querySelectorAll('.col-header')[colIdx];
  if (th) {
    const rect = th.getBoundingClientRect();
    popup.style.left = Math.min(rect.left, window.innerWidth - 330) + 'px';
    popup.style.top = (rect.bottom + 4) + 'px';
  }
  popup._colKey = col.key;
  popup._values = values;
  activeFilterPopup = popup;
  setTimeout(() => { document.addEventListener('click', closeFilterPopup, { once: true }); }, 10);
}

function closeFilterPopup() { if (activeFilterPopup) { activeFilterPopup.remove(); activeFilterPopup = null; } }
function filterPopupList(query) {
  if (filterPopupList._timer) clearTimeout(filterPopupList._timer);
  filterPopupList._timer = setTimeout(() => {
    const list = document.getElementById('popupList');
    if (!list) return;
    const q = query.toLowerCase();
    list.querySelectorAll('label').forEach(l => { l.style.display = l.textContent.toLowerCase().includes(q) ? '' : 'none'; });
  }, 150);
}
function toggleSelectAll(checkbox) {
  const list = document.getElementById('popupList');
  list.querySelectorAll('input[type="checkbox"]:not(:first-child)').forEach(cb => cb.checked = checkbox.checked);
}
function onFilterCheckChange(colKey, checkbox) {
  const list = document.getElementById('popupList');
  const all = list.querySelectorAll('input[type="checkbox"]:not(:first-child):not([style*="display: none"])');
  const checked = list.querySelectorAll('input[type="checkbox"]:not(:first-child):checked:not([style*="display: none"])');
  const sa = list.querySelector('input[type="checkbox"]:first-child');
  if (sa) sa.checked = all.length === checked.length;
}
function confirmFilter(colKey) {
  const list = document.getElementById('popupList');
  const checked = list.querySelectorAll('input[type="checkbox"]:checked:not(:first-child)');
  const sa = list.querySelector('input[type="checkbox"]:first-child');
  if (sa && sa.checked) delete columnFilters[colKey];
  else {
    const selected = new Set();
    checked.forEach(cb => { selected.add(cb.value === '(空白)' ? '' : cb.value); });
    if (selected.size === 0) delete columnFilters[colKey];
    else columnFilters[colKey] = selected;
  }
  closeFilterPopup();
  applyFilters();
}
function clearColumnFilter(colKey) { closeFilterPopup(); delete columnFilters[colKey]; applyFilters(); }
function updateFilterTags() {
  const container = document.getElementById('filterTags');
  let html = '';
  Object.keys(columnFilters).forEach(colKey => {
    const col = COLUMNS.find(c => c.key === colKey);
    if (col && columnFilters[colKey].size > 0) {
      html += '<span class="filter-tag">'+col.label+': '+columnFilters[colKey].size+'项 <span class="remove" onclick="clearColumnFilter(\''+colKey+'\')">x</span></span>';
    }
  });
  container.innerHTML = html;
}

// ========== GRID RENDER (virtual scrolling) ==========
function renderGrid() {
  const header = document.getElementById('gridHeader');
  const body = document.getElementById('gridBody');
  const container = document.getElementById('gridContainer');
  let hHtml = '<tr>';
  COLUMNS.forEach((col, i) => {
    const sortDir = sortState[col.key];
    let sortArrow = '';
    if (sortDir === 'asc') sortArrow = ' \u25B2';
    else if (sortDir === 'desc') sortArrow = ' \u25BC';
    const sortedCls = sortDir ? 'sorted' : '';
    hHtml += '<th class="col-header '+sortedCls+'" style="min-width:'+col.width+'px;max-width:'+col.width+'px;width:'+col.width+'px;position:relative;cursor:pointer;" onclick="toggleSort(\''+col.key+'\')" title="点击排序">'
      + col.label + '<span class="sort-indicator">'+sortArrow+'</span>'
      + '<span class="filter-icon" onclick="event.stopPropagation();showColumnFilter('+i+', event)" title="筛选">\u25BC</span>'
      + '<span class="resize-handle" onmousedown="startResize(event, '+i+')"></span>'
      + '</th>';
  });
  hHtml += '</tr>';
  header.innerHTML = hHtml;
  const data = filteredProducts;
  if (!data.length) {
    body.innerHTML = '<tr><td colspan="'+COLUMNS.length+'" style="text-align:center;padding:40px;color:var(--gray-400);">'+(products.length?'没有匹配的数据':'暂无数据，点击工具栏"新增"添加产品')+'</td></tr>';
    return;
  }

  const ROW_H = 28;
  const BUFFER = 20;
  let prevStart = -1, prevEnd = -1;
  let rafId = null;

  function buildRowHtml(p, absRow) {
    let html = '<tr data-abs-row="' + absRow + '" class="abs-row-' + (absRow % 2 === 0 ? 'even' : 'odd') + '">';
    COLUMNS.forEach((col, colIdx) => {
      if (col.key === 'row_num') {
        html += '<td class="row-num'+(highlightRowCol?' selected-row':'')+'">' + (absRow + 1) + '</td>';
        return;
      }
      let val = p[col.key];
      let cls = 'cell';
      let content = '';
      if (val === null || val === undefined || val === '') {
        content = '';
      } else if (col.key === 'status') {
        const sc = {pending:'#f59e0b',ordered:'#3b82f6',transit:'#8b5cf6',warehoused:'#22c55e',discontinued:'#9ca3af'};
        const statusKey = {待采购:'pending',已下单:'ordered',在途:'transit',已入库:'warehoused',停售:'discontinued'}[val]||'pending';
        content = '<span class="status-dot" style="background:'+sc[statusKey]+'"></span><span class="status-'+statusKey+'">'+escHtml(val)+'</span>';
      } else if (col.key === 'image_url') {
        content = val ? '<img src="'+escHtml(val)+'" class="img-thumb" onerror="this.style.display=\'none\'">' : '';
      } else if (col.type === 'link' && val) {
        const display = val.length > 35 ? val.slice(0,35)+'...' : val;
        content = '<a href="'+escHtml(val)+'" target="_blank" class="cell-link">'+escHtml(display)+'</a>';
      } else if (col.type === 'number') {
        const num = Number(val);
        content = '<span class="cell-content num">'+(Number.isInteger(num)&&Math.abs(num)<100000?num:num.toFixed(2))+'</span>';
      } else {
        content = escHtml(String(val));
      }
      html += '<td class="'+cls+(highlightRowCol?' highlight-row':'')+'" data-abs-row="'+absRow+'" data-col="'+colIdx+'" data-key="'+col.key+'" data-id="'+(p.id||'')+'" onclick="selectCell(this)" ondblclick="startEdit(this)">'
        + '<div class="cell-content'+(col.type==='number'?' num':'')+'">'+content+'</div>'
        + '<input class="cell-edit" onblur="finishEdit(this)" onkeydown="if(event.key===\'Enter\')this.blur();if(event.key===\'Escape\'){this.value=this.dataset.old;this.blur()}">'
        + '</td>';
    });
    html += '</tr>';
    return html;
  }

  function update() {
    const scrollTop = container.scrollTop;
    const viewH = container.clientHeight;
    const startIdx = Math.max(0, Math.floor(scrollTop / ROW_H) - BUFFER);
    const endIdx = Math.min(data.length, Math.ceil((scrollTop + viewH) / ROW_H) + BUFFER);
    if (startIdx === prevStart && endIdx === prevEnd) return;
    prevStart = startIdx; prevEnd = endIdx;

    let bHtml = '';
    if (startIdx > 0) {
      bHtml += '<tr class="v-spacer" style="height:' + (startIdx * ROW_H) + 'px;pointer-events:none"><td colspan="' + COLUMNS.length + '"></td></tr>';
    }
    for (let i = startIdx; i < endIdx; i++) {
      bHtml += buildRowHtml(data[i], i);
    }
    if (endIdx < data.length) {
      bHtml += '<tr class="v-spacer" style="height:' + ((data.length - endIdx) * ROW_H) + 'px;pointer-events:none"><td colspan="' + COLUMNS.length + '"></td></tr>';
    }
    body.innerHTML = bHtml;
  }

  if (body._scrollHandler) container.removeEventListener('scroll', body._scrollHandler);
  body._scrollHandler = function() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(update);
  };
  container.addEventListener('scroll', body._scrollHandler, { passive: true });
  update();
}

function selectCell(el) {
  if (selectedCell) selectedCell.classList.remove('selected');
  selectedCell = el;
  el.classList.add('selected');
  const row = parseInt(el.dataset.absRow) + 1;
  const col = String.fromCharCode(65 + parseInt(el.dataset.col));
  document.getElementById('cellRef').textContent = col + row;
  const content = el.querySelector('.cell-content');
  document.getElementById('formulaInput').value = content ? content.textContent.trim() : '';
}

function startEdit(el) {
  if (editingCell) finishEdit(editingCell.querySelector('.cell-edit, .cell-select-edit'));
  const editInput = el.querySelector('.cell-edit');
  const content = el.querySelector('.cell-content');
  const key = el.dataset.key;
  if (!editInput || !key || !COLUMNS.find(c=>c.key===key)?.editable) return;

  // Check if this column has dropdown options
  const dd = columnDropdowns[key];
  if (dd && dd.options && dd.options.length > 0) {
    const select = el.querySelector('.cell-select-edit');
    if (select) {
      select.classList.add('active');
      select.focus();
      editingCell = el;
      document.getElementById('formulaInput').value = select.value;
      return;
    }
    // Create select dropdown
    const currentVal = content.textContent.trim();
    let selectHtml = '<select class="cell-select-edit" onchange="onDropdownSelectChange(this)" onblur="onDropdownSelectBlur(this)" onkeydown="if(event.key===\'Escape\'){this.dataset.cancel=\'1\';this.blur()}">';
    // Add empty option
    selectHtml += '<option value=""></option>';
    dd.options.forEach(opt => {
      const selected = opt === currentVal ? ' selected' : '';
      selectHtml += '<option value="'+escHtml(opt)+'"'+selected+'>'+escHtml(opt)+'</option>';
    });
    // If allowCustom, add a custom input option
    if (dd.allowCustom) {
      selectHtml += '<option value="__CUSTOM__" '+(currentVal && !dd.options.includes(currentVal)?'selected':'')+'>✏️ 输入自定义值...</option>';
    }
    selectHtml += '</select>';
    content.insertAdjacentHTML('afterend', selectHtml);
    const newSelect = el.querySelector('.cell-select-edit');
    newSelect.classList.add('active');
    newSelect.focus();
    if (currentVal && !dd.options.includes(currentVal) && dd.allowCustom) {
      // Replace select with input for custom value
      newSelect.value = '__CUSTOM__';
      onDropdownSelectChange(newSelect);
    }
    editingCell = el;
    document.getElementById('formulaInput').value = currentVal;
    return;
  }

  editInput.value = content.textContent.trim();
  editInput.dataset.old = editInput.value;
  content.classList.add('editing');
  editInput.classList.add('active');
  editInput.focus();
  editInput.select();
  editingCell = el;
  document.getElementById('formulaInput').value = editInput.value;
}

function onDropdownSelectChange(select) {
  if (select.value === '__CUSTOM__') {
    // Replace select with text input for custom value
    const td = select.closest('td');
    const currentVal = td.querySelector('.cell-content').textContent.trim();
    select.style.display = 'none';
    const editInput = td.querySelector('.cell-edit');
    editInput.value = currentVal;
    editInput.dataset.old = currentVal;
    editInput.style.display = 'block';
    editInput.classList.add('active');
    editInput.focus();
    editInput.select();
  }
}

function onDropdownSelectBlur(select) {
  if (select.dataset.cancel === '1') {
    delete select.dataset.cancel;
    select.classList.remove('active');
    select.remove();
    editingCell = null;
    return;
  }
  // If custom input is active, handle from finishEdit
  if (select.value === '__CUSTOM__') return;
  finishDropdownEdit(select);
}

function finishDropdownEdit(select) {
  const td = select.closest('td');
  const content = td.querySelector('.cell-content');
  const newVal = select.value;
  select.classList.remove('active');
  const cell = editingCell;
  editingCell = null;
  if (newVal !== content.textContent.trim()) {
    const id = parseInt(cell.dataset.id);
    const key = cell.dataset.key;
    if (id) quickEdit(id, key, newVal);
    content.textContent = newVal;
  }
  select.remove();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && selectedCell && !editingCell) { e.preventDefault(); startEdit(selectedCell); }
  if (e.key === 'Tab' && selectedCell) {
    e.preventDefault();
    const col = parseInt(selectedCell.dataset.col), row = parseInt(selectedCell.dataset.absRow);
    const next = document.querySelector('td[data-abs-row="'+row+'"][data-col="'+(col+1)+'"]');
    if (next) { selectCell(next); if (editingCell) startEdit(next); }
  }
  if (e.key === 'ArrowDown' && selectedCell) {
    e.preventDefault();
    const col = parseInt(selectedCell.dataset.col), row = parseInt(selectedCell.dataset.absRow);
    const next = document.querySelector('td[data-abs-row="'+(row+1)+'"][data-col="'+col+'"]');
    if (next) selectCell(next);
  }
  if (e.key === 'ArrowUp' && selectedCell) {
    e.preventDefault();
    const col = parseInt(selectedCell.dataset.col), row = parseInt(selectedCell.dataset.absRow);
    const next = document.querySelector('td[data-abs-row="'+(row-1)+'"][data-col="'+col+'"]');
    if (next) selectCell(next);
  }
  if (e.key === 'ArrowLeft' && selectedCell) {
    e.preventDefault();
    const col = parseInt(selectedCell.dataset.col), row = parseInt(selectedCell.dataset.absRow);
    if (col > 0) { const next = document.querySelector('td[data-abs-row="'+row+'"][data-col="'+(col-1)+'"]'); if (next) selectCell(next); }
  }
  if (e.key === 'ArrowRight' && selectedCell) {
    e.preventDefault();
    const col = parseInt(selectedCell.dataset.col), row = parseInt(selectedCell.dataset.absRow);
    const next = document.querySelector('td[data-abs-row="'+row+'"][data-col="'+(col+1)+'"]');
    if (next) selectCell(next);
  }
});

function finishEdit(input) {
  if (!editingCell) return;
  const content = editingCell.querySelector('.cell-content');
  const newVal = input.value;
  input.classList.remove('active');
  input.style.display = ''; // Reset display for custom input mode
  content.classList.remove('editing');
  const cell = editingCell;
  editingCell = null;
  if (newVal !== input.dataset.old) {
    const id = parseInt(cell.dataset.id);
    const key = cell.dataset.key;
    let val = newVal;
    const col = COLUMNS.find(c => c.key === key);
    if (col && col.type === 'number') val = parseFloat(val) || 0;
    if (id) quickEdit(id, key, val);
    content.textContent = val;
  }
}

async function quickEdit(id, field, value) {
  try { await api('/api/products/'+id, 'PUT', {[field]: value}); document.getElementById('lastSync').textContent = '已保存 '+new Date().toLocaleTimeString(); }
  catch(e) { toast('保存失败: '+e.message, 'error'); }
}

let resizeCol = null;
function startResize(e, colIdx) { resizeCol = colIdx; document.addEventListener('mousemove', doResize); document.addEventListener('mouseup', stopResize); e.preventDefault(); }
function doResize(e) {
  if (resizeCol === null) return;
  const ths = document.querySelectorAll('.col-header');
  const th = ths[resizeCol];
  if (!th) return;
  const newW = Math.max(50, e.clientX - th.getBoundingClientRect().left);
  th.style.width = th.style.minWidth = th.style.maxWidth = newW + 'px';
  COLUMNS[resizeCol].width = newW;
  document.querySelectorAll('td[data-col="'+resizeCol+'"]').forEach(td => { td.style.minWidth = td.style.maxWidth = td.style.width = newW + 'px'; });
}
function stopResize() { resizeCol = null; document.removeEventListener('mousemove', doResize); document.removeEventListener('mouseup', stopResize); }

// ========== FORMATTING ==========
function applyFormat(type, value) {
  if (!selectedCell) { toast('请先选择一个单元格', 'info'); return; }
  const row = selectedCell.dataset.row;
  const col = selectedCell.dataset.col;
  const key = row + '_' + col;
  if (!cellStyles[key]) cellStyles[key] = {};
  const cellContent = selectedCell.querySelector('.cell-content');
  switch(type) {
    case 'bold': cellStyles[key].bold = !cellStyles[key].bold; cellContent.style.fontWeight = cellStyles[key].bold ? '700' : 'normal'; break;
    case 'italic': cellStyles[key].italic = !cellStyles[key].italic; cellContent.style.fontStyle = cellStyles[key].italic ? 'italic' : 'normal'; break;
    case 'underline': cellStyles[key].underline = !cellStyles[key].underline; cellContent.style.textDecoration = cellStyles[key].underline ? 'underline' : 'none'; break;
    case 'strikethrough': cellStyles[key].strikethrough = !cellStyles[key].strikethrough; cellContent.style.textDecoration = cellStyles[key].strikethrough ? 'line-through' : 'none'; break;
    case 'fontName': cellStyles[key].fontName = value; cellContent.style.fontFamily = value; break;
    case 'fontSize': cellStyles[key].fontSize = value; cellContent.style.fontSize = value + 'px'; break;
    case 'textColor': cellStyles[key].textColor = value; cellContent.style.color = value; break;
    case 'fillColor': cellStyles[key].fillColor = value; selectedCell.style.backgroundColor = value; break;
    case 'alignLeft': cellStyles[key].align = 'left'; cellContent.style.textAlign = 'left'; break;
    case 'alignCenter': cellStyles[key].align = 'center'; cellContent.style.textAlign = 'center'; break;
    case 'alignRight': cellStyles[key].align = 'right'; cellContent.style.textAlign = 'right'; break;
    case 'alignTop': cellStyles[key].vAlign = 'top'; cellContent.style.verticalAlign = 'top'; cellContent.style.lineHeight = '1.2'; break;
    case 'alignMiddle': cellStyles[key].vAlign = 'middle'; cellContent.style.verticalAlign = 'middle'; cellContent.style.lineHeight = 'var(--row-h)'; break;
    case 'alignBottom': cellStyles[key].vAlign = 'bottom'; cellContent.style.verticalAlign = 'bottom'; cellContent.style.lineHeight = 'var(--row-h)'; break;
    case 'border': selectedCell.style.border = '1px solid #000'; break;
    case 'merge': toast('合并单元格功能已触发', 'info'); break;
    case 'wrap': cellStyles[key].wrap = !cellStyles[key].wrap; cellContent.style.whiteSpace = cellStyles[key].wrap ? 'normal' : 'nowrap'; cellContent.style.wordBreak = cellStyles[key].wrap ? 'break-all' : 'normal'; break;
    case 'numberFormat': cellStyles[key].numberFormat = value; break;
    case 'decreaseIndent': cellContent.style.paddingLeft = (parseInt(cellContent.style.paddingLeft)||0) - 8 + 'px'; break;
    case 'increaseIndent': cellContent.style.paddingLeft = (parseInt(cellContent.style.paddingLeft)||0) + 8 + 'px'; break;
  }
}

async function loadOrders() {
  try {
    const status = document.getElementById('orderFilter').value;
    const data = await api('/api/orders?page_size=50&status='+encodeURIComponent(status));
    const list = document.getElementById('ordersList');
    document.getElementById('orderCount').textContent = '共 '+data.total+' 条';
    if (!data.items.length) { list.innerHTML = '<div style="text-align:center;padding:40px;color:var(--gray-400);">暂无采购单</div>'; return; }
    const sc = {'待审核':'#fef3c7','已批准':'#dbeafe','已下单':'#e0e7ff','已收货':'#d1fae5','已取消':'#f3f4f6'};
    const stc = {'待审核':'#92400e','已批准':'#1e40af','已下单':'#3730a3','已收货':'#065f46','已取消':'#6b7280'};
    list.innerHTML = data.items.map(o => '<div style="background:#fff;border:1px solid var(--gray-200);border-radius:8px;padding:16px;cursor:pointer;" onclick="showOrderDetail('+o.id+')"><div style="display:flex;justify-content:space-between;margin-bottom:8px;"><span style="font-weight:600;font-size:14px;">'+escHtml(o.order_number)+'</span><span style="font-size:12px;padding:2px 8px;border-radius:10px;background:'+(sc[o.status]||'#f3f4f6')+';color:'+(stc[o.status]||'#6b7280')+'">'+escHtml(o.status)+'</span></div><div style="font-size:12px;color:var(--gray-500);"><div>供应商: '+(o.supplier||'-')+'</div><div>金额: \u00A5'+o.total_amount.toFixed(2)+'</div><div>商品数: '+o.item_count+' 项</div><div>'+(o.created_by||'')+' | '+(o.created_at?new Date(o.created_at).toLocaleDateString():'')+'</div></div></div>').join('');
  } catch(e) { document.getElementById('ordersList').innerHTML = '<div style="text-align:center;padding:40px;color:var(--danger);">加载失败: '+e.message+'</div>'; }
}

function addOrderItem() {
  const div = document.createElement('div');
  div.className = 'form-row'; div.style.marginBottom = '6px';

async function submitCreateOrder() {
  const items = [];
  document.querySelectorAll('.oi-sku').forEach((el, i) => {
    const sku = el.value.trim(); if (!sku) return;
    const qty = parseInt(document.querySelectorAll('.oi-qty')[i].value)||1;
    const price = parseFloat(document.querySelectorAll('.oi-price')[i].value)||0;
    items.push({product_name: sku, sku, quantity: qty, unit_price: price});
  });
  if (!items.length) { toast('请至少添加一个商品', 'error'); return; }
  try { await api('/api/orders', 'POST', {supplier: document.getElementById('o_supplier').value, notes: document.getElementById('o_notes').value, items}); toast('采购单创建成功', 'success'); closeModal(); loadOrders(); } catch(e) { toast(e.message, 'error'); }
}

async function aiSuggestOrder() {

function showImport() {
  document.getElementById('modalTitle').textContent = '导入数据';
  document.getElementById('modalBody').innerHTML = '<div style="margin-bottom:16px;"><p style="font-size:13px;color:var(--gray-500);margin-bottom:8px;">方式一：上传Excel文件（.xlsx，表头自动匹配）</p><input type="file" id="excelFileInput" accept=".xlsx" style="font-size:13px;"><button class="btn btn-primary btn-sm" onclick="uploadExcel()" style="margin-top:8px;">上传并导入</button></div><div style="border-top:1px solid var(--gray-200);padding-top:16px;"><p style="font-size:13px;color:var(--gray-500);margin-bottom:8px;">方式二：粘贴JSON数据</p><textarea id="importData" rows="8" style="width:100%;font-family:monospace;font-size:12px;padding:8px;border:1px solid var(--gray-200);border-radius:6px;" placeholder=\'[{"sku":"...","product_name":"..."}]\'></textarea></div>';
  document.getElementById('modalFooter').innerHTML = '<button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="submitImport()">导入JSON</button>';
  document.getElementById('modalOverlay').classList.add('active');
}
async function uploadExcel() {
  const fileInput = document.getElementById('excelFileInput');
  if (!fileInput.files.length) { toast('请选择Excel文件', 'error'); return; }
  const formData = new FormData(); formData.append('file', fileInput.files[0]);
  try {
    const resp = await fetch('/api/products/upload-excel', {method:'POST', headers:{'Authorization':'Bearer '+TOKEN}, body: formData});
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || '上传失败');
    toast(data.message, 'success'); closeModal(); loadData();
  } catch(e) {
    const msg = e.message || '';
    if (msg.includes('UNIQUE') || msg.includes('IntegrityError')) {
      toast('导入失败: 数据中存在重复SKU，请检查文件后重试', 'error');
    } else {
      toast('上传失败: '+msg, 'error');
    }
  }
}
async function submitImport() {
  const raw = document.getElementById('importData').value.trim();
  if (!raw) { toast('请粘贴数据', 'error'); return; }
  try {
    const data = JSON.parse(raw); if (!Array.isArray(data)) throw new Error('数据必须是数组');
    const r = await api('/api/products/import', 'POST', data); toast(r.message, 'success'); closeModal(); loadData();
  } catch(e) { toast('导入失败: '+e.message, 'error'); }
}

// ========== DASHBOARD ==========
function showDashboard() {
  document.getElementById('modalTitle').textContent = '生成仪表盘';
  document.getElementById('modalWindow').className = 'modal modal-wide';
  document.getElementById('modalBody').innerHTML = '<div class="text-center text-muted" style="padding:20px;"><span class="loading"></span> 生成仪表盘中...</div>';
  document.getElementById('modalFooter').innerHTML = '<button class="btn btn-outline" onclick="closeModal()">关闭</button>';
  document.getElementById('modalOverlay').classList.add('active');
  setTimeout(() => {
    const total = products.length;
    const catMap = {}, statusMap = {};
    let lowStock = [], totalPurchaseQty = 0, totalPurchasePrice = 0;
    products.forEach(p => {
      const cat = p.category || '(未分类)'; catMap[cat] = (catMap[cat]||0) + 1;
      const st = p.status || '待采购'; statusMap[st] = (statusMap[st]||0) + 1;
      if (p.stock_quantity < 10) lowStock.push(p);
      totalPurchaseQty += (p.purchase_quantity||0); totalPurchasePrice += (p.purchase_price||0);
    });
    const catEntries = Object.entries(catMap).sort((a,b)=>b[1]-a[1]);
    const pieColors = ['#4a6cf7','#22c55e','#f59e0b','#ef4444','#8b5cf6','#ec4899','#14b8a6','#f97316','#6366f1','#84cc16'];
    const totalCat = catEntries.reduce((s,e)=>s+e[1],0);
    let pieSvg = '';
    if (totalCat > 0) {
      let cumulative = 0;
      const slices = catEntries.map((e,i) => {
        const pct = e[1]/totalCat, start = cumulative*360, end = (cumulative+pct)*360;
        cumulative += pct;
        const r=70, cx=100, cy=100;
        const sRad = (start-90)*Math.PI/180, eRad = (end-90)*Math.PI/180;
        const x1=cx+r*Math.cos(sRad), y1=cy+r*Math.sin(sRad), x2=cx+r*Math.cos(eRad), y2=cy+r*Math.sin(eRad);
        const large = (end-start)>180?1:0;
        return '<path d="M'+cx+' '+cy+' L'+x1+' '+y1+' A'+r+' '+r+' 0 '+large+' 1 '+x2+' '+y2+' Z" fill="'+pieColors[i%pieColors.length]+'" stroke="#fff" stroke-width="1"/>';
      });
      pieSvg = '<svg width="200" height="200" viewBox="0 0 200 200">'+slices.join('')+'</svg>';
    }
    const statusEntries = Object.entries(statusMap).sort((a,b)=>b[1]-a[1]);
    const barColors = {'待采购':'#f59e0b','已下单':'#3b82f6','在途':'#8b5cf6','已入库':'#22c55e','停售':'#9ca3af'};
    const maxStatus = Math.max(...statusEntries.map(e=>e[1]),1);
    let barSvg = '<svg width="300" height="160" viewBox="0 0 300 160">';
    statusEntries.forEach((e,i) => {
      const barH = (e[1]/maxStatus)*100, x = 20+i*60;
      barSvg += '<rect x="'+x+'" y="'+(140-barH)+'" width="40" height="'+barH+'" fill="'+(barColors[e[0]]||'#4a6cf7')+'" rx="3"/>';
      barSvg += '<text x="'+(x+20)+'" y="150" text-anchor="middle" font-size="9" fill="#666">'+e[0]+'</text>';
      barSvg += '<text x="'+(x+20)+'" y="'+(140-barH-4)+'" text-anchor="middle" font-size="10" fill="#333" font-weight="600">'+e[1]+'</text>';
    });
    barSvg += '</svg>';
    const lowStockHtml = lowStock.slice(0,10).map(p => '<div class="stat-row danger"><span class="stat-name">'+escHtml(p.sku)+' - '+escHtml(p.product_name)+'</span><span class="stat-val">库存: '+(p.stock_quantity||0)+'</span></div>').join('');
    document.getElementById('modalBody').innerHTML = '<div class="dashboard-grid"><div class="dashboard-card"><h4>产品总数</h4><div class="stat-value">'+total+'</div><div class="stat-label">总采购量: '+totalPurchaseQty+' | 总金额: \u00A5'+totalPurchasePrice.toFixed(2)+'</div></div><div class="dashboard-card"><h4>最近活动</h4><div style="font-size:12px;color:var(--gray-500);margin-top:8px;"><div>最后更新: '+new Date().toLocaleString()+'</div><div>低库存: <span style="color:var(--danger);font-weight:600;">'+lowStock.length+'</span> 个</div><div>数据量: '+products.length+' 条</div></div></div><div class="dashboard-card"><h4>分类分布</h4><div class="chart-container" style="display:flex;align-items:center;gap:12px;">'+pieSvg+'<div style="font-size:11px;flex:1;">'+catEntries.slice(0,8).map((e,i) => '<div style="display:flex;align-items:center;gap:4px;margin:2px 0;"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:'+pieColors[i%pieColors.length]+';"></span> '+escHtml(e[0])+' ('+e[1]+')</div>').join('')+'</div></div></div><div class="dashboard-card"><h4>状态分布</h4><div class="chart-container">'+barSvg+'</div></div></div><div class="dashboard-card"><h4>低库存预警 (库存 < 10)</h4>'+(lowStock.length>0?lowStockHtml:'<div style="font-size:12px;color:var(--gray-400);padding:8px 0;">暂无低库存商品</div>')+(lowStock.length>10?'<div style="font-size:11px;color:var(--gray-400);margin-top:4px;">...还有 '+(lowStock.length-10)+' 个</div>':'')+'</div>';
  }, 100);
}

function showCollectForm() {
  document.getElementById('modalTitle').textContent = '收集表';
  document.getElementById('modalWindow').className = 'modal';
  const cols = COLUMNS.filter(c => c.key !== 'row_num' && c.key !== 'image_url');
  document.getElementById('modalBody').innerHTML = '<p style="font-size:12px;color:var(--gray-500);margin-bottom:12px;">选择要包含在收集表中的字段，生成可分享的收集链接。</p><div style="max-height:300px;overflow-y:auto;border:1px solid var(--gray-200);border-radius:6px;padding:8px;">'+cols.map(c => '<label style="display:flex;align-items:center;gap:6px;padding:4px 0;font-size:12px;cursor:pointer;"><input type="checkbox" class="cf-col" value="'+c.key+'" checked> '+escHtml(c.label)+'</label>').join('')+'</div><div class="collect-form-preview" id="collectFormPreview"><h4 style="font-size:13px;margin-bottom:8px;">表单预览</h4>'+cols.slice(0,5).map(c => '<div class="cf-field"><label>'+escHtml(c.label)+'</label><input placeholder="请输入..." readonly></div>').join('')+'</div>';
  document.getElementById('modalFooter').innerHTML = '<button class="btn btn-outline" onclick="closeModal()">关闭</button><button class="btn btn-primary" onclick="generateCollectLink()">生成收集链接</button>';
  document.getElementById('modalOverlay').classList.add('active');
  setTimeout(() => {
    document.querySelectorAll('.cf-col').forEach(cb => cb.addEventListener('change', updateCollectFormPreview));
  }, 50);
}
function updateCollectFormPreview() {
  const checked = document.querySelectorAll('.cf-col:checked');
  const preview = document.getElementById('collectFormPreview');
  if (checked.length === 0) { preview.innerHTML = '<div style="font-size:12px;color:var(--gray-400);padding:20px;text-align:center;">请至少选择一个字段</div>'; return; }
  let html = '<h4 style="font-size:13px;margin-bottom:8px;">表单预览</h4>';
  checked.forEach(cb => { const col = COLUMNS.find(c => c.key === cb.value); if (col) html += '<div class="cf-field"><label>'+escHtml(col.label)+'</label><input placeholder="请输入..." readonly></div>'; });
  html += '<button class="btn btn-primary btn-block" style="margin-top:12px;" disabled>提交</button>';
  preview.innerHTML = html;
}
function generateCollectLink() {
  const checked = document.querySelectorAll('.cf-col:checked');
  if (checked.length === 0) { toast('请至少选择一个字段', 'error'); return; }
  const fields = Array.from(checked).map(cb => cb.value);
  const link = window.location.origin + '/collect?fields=' + fields.join(',');
  toast('收集链接已生成: '+link, 'success');

function renderGroups() {
  const groupBy = document.getElementById('groupBySelect').value;
  const groups = {};
  products.forEach(p => {
    const key = p[groupBy] || '(未设置)';
    if (!groups[key]) groups[key] = [];
    groups[key].push(p);
  });
  const container = document.getElementById('groupResults');
  const entries = Object.entries(groups).sort((a,b) => b[1].length - a[1].length);
  container.innerHTML = entries.map(([key, items]) => {
    const totalQty = items.reduce((s, p) => s + (p.purchase_quantity||0), 0);
    const totalPrice = items.reduce((s, p) => s + (p.purchase_price||0), 0);
    return '<div class="group-item"><div class="group-header" onclick="this.nextElementSibling.classList.toggle(\'open\')"><span class="group-name">'+escHtml(key)+'</span><span class="group-stats">'+items.length+' 项 | 采购量: '+totalQty+' | 金额: \u00A5'+totalPrice.toFixed(2)+'</span></div><div class="group-body"><table><thead><tr><th>SKU</th><th>标题</th><th>采购量</th><th>采购价</th><th>库存</th><th>状态</th></tr></thead><tbody>'+items.slice(0,20).map(p => '<tr><td>'+escHtml(p.sku||'')+'</td><td>'+escHtml(p.product_name||'')+'</td><td>'+(p.purchase_quantity||0)+'</td><td>\u00A5'+(p.purchase_price||0).toFixed(2)+'</td><td>'+(p.stock_quantity||0)+'</td><td>'+escHtml(p.status||'')+'</td></tr>').join('')+'</tbody></table>'+(items.length>20?'<div style="font-size:11px;color:var(--gray-400);padding:8px 0;text-align:center;">还有 '+(items.length-20)+' 项...</div>':'')+'</div></div>';
  }).join('');
}

  document.getElementById('notifLowStockEnabled').checked = s.lowStockEnabled !== false;
  document.getElementById('notifWebhookUrl').value = s.webhookUrl || localStorage.getItem('WECOM_WEBHOOK_URL') || '';
  document.getElementById('notifFrequency').value = s.frequency || 'daily';

function saveNotificationSettings() {
  localStorage.setItem('notifSettings', JSON.stringify({lowStockThreshold: parseInt(document.getElementById('notifLowStockThreshold').value)||10, lowStockEnabled: document.getElementById('notifLowStockEnabled').checked, webhookUrl: document.getElementById('notifWebhookUrl').value, frequency: document.getElementById('notifFrequency').value}));
  if (document.getElementById('notifWebhookUrl').value) localStorage.setItem('WECOM_WEBHOOK_URL', document.getElementById('notifWebhookUrl').value);
  toast('通知设置已保存', 'success');
}
function testNotification() {
  const result = document.getElementById('notifTestResult');
  result.innerHTML = '<span class="loading"></span> 发送测试通知...';
  const webhookUrl = document.getElementById('notifWebhookUrl').value;
  if (!webhookUrl) { result.innerHTML = '<span style="color:var(--danger);">请先配置Webhook URL</span>'; return; }
  setTimeout(() => {
    const lowStock = products.filter(p => p.stock_quantity < 10);
    fetch(webhookUrl, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({msgtype:'markdown', markdown:{content:'### 采购系统测试通知\n\n测试消息 - 自动通知功能正常\n\n当前低库存商品: '+lowStock.length+' 个\n\n发送时间: '+new Date().toLocaleString()}})})
    .then(r => r.json()).then(() => { result.innerHTML = '<span style="color:var(--success);">测试通知发送成功!</span>'; })
    .catch(() => { result.innerHTML = '<span style="color:var(--warning);">配置已保存，实际使用时将由服务器端发送。</span>'; });
  }, 500);
}

// ========== AI CLASSIFICATION ==========
function showAIClassify() {
  document.getElementById('modalTitle').textContent = 'AI分类总结';
  document.getElementById('modalWindow').className = 'modal modal-wide';
  document.getElementById('modalBody').innerHTML = '<div class="form-group"><label>选择要分析的列</label><select id="classifyColumn" onchange="updateClassifyPreview()"><option value="category">组别</option><option value="attribute">属性</option><option value="store">店铺</option><option value="supplier">供应商</option><option value="status">状态</option></select></div><div id="classifyPreview" style="font-size:12px;color:var(--gray-500);margin-bottom:12px;">选择上方列后，点击"开始分析"按钮使用AI进行数据分类总结。</div><div id="classifyResult"></div>';
  document.getElementById('modalFooter').innerHTML = '<button class="btn btn-outline" onclick="closeModal()">关闭</button><button class="btn btn-primary" onclick="runAIClassify()">开始分析</button>';
  document.getElementById('modalOverlay').classList.add('active');
  updateClassifyPreview();
}
function updateClassifyPreview() {
  const colKey = document.getElementById('classifyColumn').value;
  const values = new Set();
  products.forEach(p => { const v = p[colKey]; if (v) values.add(v); });
  document.getElementById('classifyPreview').innerHTML = '列: '+(COLUMNS.find(c=>c.key===colKey)?.label||colKey)+' | 唯一值: '+values.size+' 个 | 总数据: '+products.length+' 条';
}
function runAIClassify() {
  const colKey = document.getElementById('classifyColumn').value;
  const resultDiv = document.getElementById('classifyResult');
  resultDiv.innerHTML = '<span class="loading"></span> AI分析中...';
  const items = products.slice(0, 50);
  const ids = items.map(p => p.id).filter(id => id);
  if (ids.length === 0) { resultDiv.innerHTML = '<div style="color:var(--danger);">没有可分析的数据</div>'; return; }
  api('/api/ai/classify', 'POST', {product_ids: ids, category: colKey})
  .then(d => {
    let html = '<div class="ai-classify-result">';
    if (d.classifications && d.classifications.length) {
      const groups = {};
      d.classifications.forEach(c => { const cat = c.suggested_category||'未分类'; if (!groups[cat]) groups[cat] = []; groups[cat].push(c); });
      Object.entries(groups).forEach(([cat, items]) => {
        html += '<div class="result-section"><h5>'+escHtml(cat)+' ('+items.length+')</h5>';
        items.slice(0,5).forEach(c => { html += '<div style="font-size:11px;color:var(--gray-500);margin:2px 0;">'+escHtml(c.sku)+' - 置信度: '+escHtml(c.confidence||'中')+'</div>'; });
        if (items.length > 5) html += '<div style="font-size:11px;color:var(--gray-400);">...还有 '+(items.length-5)+' 项</div>';
        html += '</div>';
      });
    }
    if (d.summary) html += '<div class="result-section"><h5>总结</h5><p>'+escHtml(d.summary)+'</p></div>';
    html += '</div>';
    resultDiv.innerHTML = html;
  })
  .catch(e => { resultDiv.innerHTML = '<div style="color:var(--danger);">分析失败: '+e.message+'</div>'; });
}

    quickCreateName: { title: '快速创建名称', body: '<div class="form-group"><label>名称</label><input placeholder="输入名称（如：采购金额）"></div><div class="form-group"><label>引用位置</label><input placeholder="选择或输入区域"></div><div class="form-group"><label>范围</label><select><option>工作簿</option><option>工作表</option></select></div>', footer: 'okClose' },
    crossFileRef: { title: '跨文件引用', body: '<div class="form-group"><label>引用文件</label><select><option>从云盘选择</option><option>输入链接</option></select></div><div class="form-group"><label>文件链接</label><input placeholder="https://..."></div><div class="form-group"><label>选择数据范围</label><input placeholder="如: Sheet1!A1:C10"></div>', footer: 'okClose' },
    calculationOptions: { title: '计算选项', body: '<div style="display:flex;flex-direction:column;gap:8px;"><label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;"><input type="radio" name="calcMode" checked> 自动计算</label><label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;"><input type="radio" name="calcMode"> 手动计算</label><label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;"><input type="checkbox"> 除手动时自动重算</label><label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;"><input type="checkbox"> 迭代计算</label></div>', footer: 'okClose' },

  const dlg = dialogs[type];
