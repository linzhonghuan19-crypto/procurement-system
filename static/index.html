  document.getElementById('modalTitle').textContent = dlg.title;
  document.getElementById('modalWindow').className = 'modal';
  // If the dialog has a custom handler function, call it instead
  if (dlg.handler && typeof window[dlg.handler] === 'function') {
    window[dlg.handler]();
    return;
  }
  document.getElementById('modalBody').innerHTML = dlg.body;
  if (dlg.footer === 'okClose') {
    document.getElementById('modalFooter').innerHTML = '<button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="toast(\'操作完成\',\'success\');closeModal()">确定</button>';
  } else {
    document.getElementById('modalFooter').innerHTML = '<button class="btn btn-outline" onclick="closeModal()">关闭</button>';
  }
  document.getElementById('modalOverlay').classList.add('active');
}

function updateCFPreview() {
  const val = document.getElementById('cfValue')?.value || '';
  const color = document.getElementById('cfColor')?.value || '#ff0000';
  const bg = document.getElementById('cfBgColor')?.value || '#ffebee';
  const preview = document.getElementById('cfPreview');
  if (preview) preview.style.cssText = 'color:'+color+';background:'+bg+';padding:6px;border-radius:4px;';
}

// ========== DROPDOWN OPTIONS DIALOG ==========
function showDropdownOptionsDialog() {
  // Build column selector (only editable text columns, not numbers/links/images)
  const editableCols = COLUMNS.filter(c => c.editable && c.type !== 'number' && c.type !== 'link' && c.type !== 'image' && c.key !== 'row_num');
  const colOptions = editableCols.map(c => '<option value="'+c.key+'">'+escHtml(c.label)+'</option>').join('');

  // Find which column is currently selected
  const selectedColKey = selectedCell ? selectedCell.dataset.key : '';

  const bodyHtml = '<div class="form-group"><label>应用到列</label><select id="ddColumnSelect" onchange="onDropdownColumnChange()">'+colOptions+'</select></div>'
    + '<div class="form-group"><label>选项（每行一个）</label><textarea id="ddOptionsText" rows="6" style="width:100%;font-family:monospace;resize:vertical;" placeholder="每行输入一个选项值"></textarea></div>'
    + '<div class="form-group"><label style="display:flex;align-items:center;gap:6px;font-size:12px;"><input type="checkbox" id="ddAllowCustom" checked> 允许下拉以外值</label></div>'
    + '<div style="font-size:12px;color:var(--gray-500);padding:4px 0;"><span id="ddStatus">提示：从已有数据中提取选项，或手动输入</span></div>';

  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalFooter').innerHTML = '<button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-outline" onclick="extractColumnOptions()" style="margin-right:auto;">从数据提取</button><button class="btn btn-outline" onclick="clearDropdownOptions()" style="color:var(--danger);">清除</button><button class="btn btn-primary" onclick="saveDropdownOptions()">确定</button>';
  document.getElementById('modalOverlay').classList.add('active');

  // If a column was selected, load its existing options
  if (selectedColKey) {
    setTimeout(() => {
      document.getElementById('ddColumnSelect').value = selectedColKey;
      onDropdownColumnChange();
    }, 50);
  }
}

function onDropdownColumnChange() {
  const colKey = document.getElementById('ddColumnSelect').value;
  const dd = columnDropdowns[colKey];
  if (dd && dd.options && dd.options.length) {
    document.getElementById('ddOptionsText').value = dd.options.join('\n');
    document.getElementById('ddAllowCustom').checked = dd.allowCustom !== false;
    document.getElementById('ddStatus').textContent = '已配置 ' + dd.options.length + ' 个选项' + (dd.allowCustom !== false ? '（允许自定义）' : '（仅限下拉值）');
  } else {
    document.getElementById('ddOptionsText').value = '';
    document.getElementById('ddAllowCustom').checked = true;
    document.getElementById('ddStatus').textContent = '该列暂无下拉选项配置';
  }
}

function extractColumnOptions() {
  const colKey = document.getElementById('ddColumnSelect').value;
  if (!products.length) { toast('没有数据可提取', 'info'); return; }
  const values = new Set();
  products.forEach(p => {
    const v = p[colKey];
    if (v !== null && v !== undefined && String(v).trim()) {
      values.add(String(v).trim());
    }
  });
  const sorted = Array.from(values).sort();
  if (sorted.length === 0) { toast('该列没有数据', 'info'); return; }
  document.getElementById('ddOptionsText').value = sorted.join('\n');
  document.getElementById('ddStatus').textContent = '已从现有数据中提取 ' + sorted.length + ' 个唯一值';
  toast('已提取 ' + sorted.length + ' 个选项', 'success');
}

function saveDropdownOptions() {
  const colKey = document.getElementById('ddColumnSelect').value;
  const text = document.getElementById('ddOptionsText').value;
  const allowCustom = document.getElementById('ddAllowCustom').checked;
  const options = text.split('\n').map(s => s.trim()).filter(s => s.length > 0);
  if (options.length === 0) {
    delete columnDropdowns[colKey];
    persistDropdownOptions();
    toast('已清除该列的下拉选项', 'info');
  } else {
    columnDropdowns[colKey] = { options, allowCustom };
    persistDropdownOptions();
    toast('下拉选项已保存：' + options.length + ' 个选项', 'success');
  }
  closeModal();
  // Re-render to apply the dropdown to visible cells
  renderGrid();
}

function clearDropdownOptions() {
  const colKey = document.getElementById('ddColumnSelect').value;
  if (columnDropdowns[colKey]) {
    delete columnDropdowns[colKey];
    persistDropdownOptions();
    toast('已清除下拉选项', 'info');
  } else {
    toast('该列没有下拉选项', 'info');
  }
  closeModal();
  renderGrid();
}

// ========== MODAL HELPERS ==========
function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }
function closeSidebar() { document.getElementById('sidebarPanel').classList.remove('active'); }

// ========== TOAST ==========
function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + (type||'info');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove('show'), 2500);
}

// ========== UTILITY ==========
function escHtml(s) {
  if (s === null || s === undefined) return '';
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

// ========== INIT ==========
if (TOKEN) showApp();
