 <!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海外仓总采购表</title>
<style>
:root {
  --primary: #4a6cf7;
  --primary-hover: #3b5de7;
  --primary-light: #eef1ff;
  --success: #22c55e;
  --warning: #f59e0b;
  --danger: #ef4444;
  --gray-50: #f8f9fa;
  --gray-100: #f0f1f3;
  --gray-150: #e8eaed;
  --gray-200: #dadce0;
  --gray-300: #bdc1c6;
  --gray-400: #9aa0a6;
  --gray-500: #80868b;
  --gray-600: #5f6368;
  --gray-700: #3c4043;
  --gray-800: #202124;
  --header-bg: #f0f1f3;
  --selected-bg: #e8f0fe;
  --selected-border: #1a73e8;
  --gridline: #e0e0e0;
  --header-h: 32px;
  --row-h: 28px;
  --toolbar-h: 48px;
  --formula-h: 36px;
  --status-h: 28px;
  --col-w: 120px;
  --row-num-w: 50px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif; font-size: 13px; color: var(--gray-800); background: #fff; overflow: hidden; height: 100vh; user-select: none; }
input, textarea, select { font-family: inherit; font-size: 13px; }
a { color: var(--primary); text-decoration: none; }

/* ===== LOGIN ===== */
.login-page { display: flex; align-items: center; justify-content: center; height: 100vh; background: #f0f2f5; }
.login-card { background: #fff; border-radius: 12px; padding: 36px; width: 380px; box-shadow: 0 2px 16px rgba(0,0,0,0.08); }
.login-card h1 { font-size: 20px; text-align: center; margin-bottom: 4px; color: var(--gray-800); }
.login-card .subtitle { text-align: center; color: var(--gray-500); font-size: 13px; margin-bottom: 24px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 12px; font-weight: 500; color: var(--gray-600); margin-bottom: 4px; }
.form-group input { width: 100%; padding: 10px 12px; border: 1px solid var(--gray-200); border-radius: 8px; font-size: 14px; }
.form-group input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(74,108,247,0.1); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 18px; border-radius: 6px; font-weight: 500; font-size: 13px; border: none; cursor: pointer; transition: all 0.15s; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-outline { background: transparent; border: 1px solid var(--gray-200); color: var(--gray-600); }
.btn-outline:hover { background: var(--gray-50); border-color: var(--gray-300); }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-block { width: 100%; padding: 10px; }
.btn-link { background: none; border: none; color: var(--primary); cursor: pointer; font-size: 12px; padding: 0; }
.btn-link:hover { text-decoration: underline; }
.btn-icon { background: none; border: none; padding: 4px 6px; border-radius: 4px; cursor: pointer; color: var(--gray-500); font-size: 16px; line-height: 1; }
.btn-icon:hover { background: var(--gray-100); color: var(--gray-700); }
.hidden { display: none !important; }

/* ===== SPREADSHEET LAYOUT ===== */
.spreadsheet-app { display: none; height: 100vh; flex-direction: column; }
.spreadsheet-app.active { display: flex; }

/* ===== TOOLBAR ===== */
.toolbar { display: flex; align-items: center; height: var(--toolbar-h); padding: 0 12px; border-bottom: 1px solid var(--gray-200); background: #fff; gap: 4px; flex-shrink: 0; }
.toolbar .doc-title { font-size: 15px; font-weight: 500; color: var(--gray-800); padding: 4px 8px; border-radius: 4px; cursor: default; }
.toolbar .doc-title:hover { background: var(--gray-100); }
.toolbar .doc-title input { display: none; border: none; font-size: 15px; font-weight: 500; outline: none; background: var(--gray-100); padding: 2px 4px; border-radius: 2px; }
.toolbar .doc-title.editing input { display: inline; }
.toolbar .doc-title.editing span { display: none; }
.toolbar .star { color: var(--gray-300); cursor: pointer; font-size: 16px; padding: 4px; }
.toolbar .star:hover { color: var(--warning); }
.toolbar-sep { width: 1px; height: 24px; background: var(--gray-200); margin: 0 4px; }
.toolbar-group { display: flex; align-items: center; gap: 2px; }
.toolbar-btn { padding: 4px 8px; border-radius: 4px; cursor: pointer; color: var(--gray-600); font-size: 13px; border: none; background: none; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.toolbar-btn:hover { background: var(--gray-100); }
.toolbar-btn b { font-weight: 600; }
.toolbar-right { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.user-avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 12px; cursor: pointer; }
.user-avatar:hover { opacity: 0.8; }

/* ===== FORMULA BAR ===== */
.formula-bar { display: flex; align-items: center; height: var(--formula-h); border-bottom: 1px solid var(--gray-200); background: #fff; flex-shrink: 0; }
.formula-bar .cell-ref { width: 60px; text-align: center; font-size: 12px; font-weight: 600; color: var(--gray-600); border-right: 1px solid var(--gray-200); height: 100%; display: flex; align-items: center; justify-content: center; background: var(--gray-50); }
.formula-bar .fx { padding: 0 8px; color: var(--gray-400); font-size: 12px; font-style: italic; }
.formula-bar .formula-input { flex: 1; height: 100%; border: none; outline: none; padding: 0 8px; font-size: 13px; }

/* ===== GRID ===== */
.grid-container { flex: 1; overflow: auto; position: relative; }
.grid-scroll { min-width: 100%; }
.grid-table { border-collapse: collapse; width: max-content; }

/* Header row (column letters) */
.grid-table th.col-header { 
  background: var(--header-bg); 
  border-right: 1px solid var(--gridline); 
  border-bottom: 1px solid var(--gray-300); 
  height: var(--header-h); 
  padding: 0; 
  text-align: center; 
  font-size: 11px; 
  font-weight: 500; 
  color: var(--gray-500); 
  position: sticky; 
  top: 0; 
  z-index: 3; 
  min-width: var(--col-w);
  max-width: var(--col-w);
  width: var(--col-w);
}
.grid-table th.col-header:first-child { 
  min-width: var(--row-num-w); 
  max-width: var(--row-num-w); 
  width: var(--row-num-w); 
  z-index: 4; 
  left: 0; 
  position: sticky;
}
.grid-table th.col-header .resize-handle { 
  position: absolute; right: 0; top: 0; bottom: 0; width: 4px; cursor: col-resize; 
}
.grid-table th.col-header .resize-handle:hover { background: var(--selected-border); }
.grid-table th.col-header .filter-icon { 
  font-size: 10px; margin-left: 2px; opacity: 0.4; cursor: pointer; 
  display: inline-block; vertical-align: middle;
}
.grid-table th.col-header .filter-icon:hover { opacity: 1; }

/* Row number column */
.grid-table td.row-num { 
  background: var(--header-bg); 
  border-right: 1px solid var(--gray-300); 
  border-bottom: 1px solid var(--gridline); 
  text-align: center; 
  font-size: 11px; 
  color: var(--gray-500); 
  padding: 0; 
  min-width: var(--row-num-w); 
  max-width: var(--row-num-w); 
  width: var(--row-num-w); 
  height: var(--row-h);
  position: sticky;
  left: 0;
  z-index: 2;
}
.grid-table td.row-num.selected-row { background: var(--selected-bg); color: var(--selected-border); font-weight: 600; }

/* Data cells */
.grid-table td.cell { 
  border-right: 1px solid var(--gridline); 
  border-bottom: 1px solid var(--gridline); 
  padding: 0; 
  height: var(--row-h); 
  min-width: var(--col-w);
  max-width: var(--col-w);
  width: var(--col-w);
  position: relative;
  cursor: cell;
}
.grid-table td.cell .cell-content { 
  padding: 0 6px; 
  line-height: var(--row-h); 
  overflow: hidden; 
  text-overflow: ellipsis; 
  white-space: nowrap;
  font-size: 13px;
  height: 100%;
}
.grid-table td.cell.selected { 
  outline: 2px solid var(--selected-border); 
  outline-offset: -1px;
  z-index: 1;
}
.grid-table td.cell .cell-content.editing { display: none; }
.grid-table td.cell .cell-edit { 
  display: none; 
  position: absolute; 
  inset: 0; 
  border: none; 
  outline: none; 
  padding: 0 6px; 
  font-size: 13px;
  font-family: inherit;
  z-index: 5;
}
.grid-table td.cell .cell-edit.active { display: block; }
.grid-table td.cell .cell-content.num { text-align: right; }
.grid-table td.cell .cell-content.link { color: var(--primary); cursor: pointer; }
.grid-table td.cell .cell-content.link:hover { text-decoration: underline; }
.grid-table td.cell .cell-content.status { font-size: 12px; font-weight: 500; }
.grid-table td.cell .cell-content .status-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
.grid-table td.cell .cell-content .img-thumb { width: 24px; height: 24px; object-fit: cover; border-radius: 2px; vertical-align: middle; cursor: pointer; }
.grid-table td.cell .cell-content .img-thumb:hover { transform: scale(1.2); }

/* Status colors */
.status-pending { color: #b45309; }
.status-ordered { color: #1e40af; }
.status-transit { color: #6d28d9; }
.status-warehoused { color: #065f46; }
.status-discontinued { color: var(--gray-400); }

/* Zebra */
.grid-table tr:nth-child(even) td.cell { background: #fafafa; }
.grid-table tr:nth-child(even) td.row-num { background: var(--header-bg); }
.grid-table tr:hover td.cell { background: #f5f8ff; }
.grid-table tr:hover td.row-num { background: #e8ecf4; }

/* ===== BOTTOM BAR ===== */
.status-bar { 
  display: flex; 
  align-items: center; 
  height: var(--status-h); 
  border-top: 1px solid var(--gray-200); 
  background: #fff; 
  padding: 0 12px; 
  font-size: 11px; 
  color: var(--gray-500); 
  gap: 16px;
  flex-shrink: 0;
}
.status-bar .sheet-tabs { display: flex; align-items: center; gap: 0; margin-left: -12px; }
.status-bar .sheet-tab { 
  padding: 2px 16px; 
  border-right: 1px solid var(--gray-200); 
  cursor: pointer; 
  font-size: 12px; 
  color: var(--gray-500); 
  height: var(--status-h); 
  display: flex; 
  align-items: center;
}
.status-bar .sheet-tab.active { 
  border-bottom: 2px solid var(--primary); 
  color: var(--primary); 
  font-weight: 500; 
}
.status-bar .sheet-tab:hover { background: var(--gray-50); }
.status-bar .status-right { margin-left: auto; display: flex; gap: 16px; }

/* ===== TOAST ===== */
.toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(20px); z-index: 9999; padding: 10px 20px; border-radius: 8px; color: #fff; font-size: 13px; font-weight: 500; box-shadow: 0 4px 16px rgba(0,0,0,0.15); opacity: 0; transition: all 0.3s; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }
.toast.info { background: var(--primary); }

/* ===== MODAL ===== */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 1000; align-items: center; justify-content: center; }
.modal-overlay.active { display: flex; }
.modal { background: #fff; border-radius: 12px; width: 90%; max-width: 700px; max-height: 85vh; overflow: auto; box-shadow: 0 8px 32px rgba(0,0,0,0.12); }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--gray-200); }
.modal-header h3 { font-size: 15px; font-weight: 600; }
.modal-close { background: none; border: none; font-size: 20px; color: var(--gray-400); padding: 4px; cursor: pointer; }
.modal-close:hover { color: var(--gray-600); }
.modal-body { padding: 20px; }
.modal-footer { padding: 12px 20px; border-top: 1px solid var(--gray-200); display: flex; justify-content: flex-end; gap: 8px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

/* ===== DROPDOWN ===== */
.dropdown { position: relative; display: inline-block; }
.dropdown-menu { display: none; position: absolute; top: 100%; right: 0; background: #fff; border: 1px solid var(--gray-200); border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.1); z-index: 100; min-width: 180px; padding: 4px; }
.dropdown-menu.show { display: block; }
.dropdown-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; color: var(--gray-700); }
.dropdown-item:hover { background: var(--gray-50); }
.dropdown-sep { height: 1px; background: var(--gray-200); margin: 4px 0; }

/* ===== FILTER DROPDOWN ===== */
.filter-dropdown { position: absolute; top: 100%; left: 0; background: #fff; border: 1px solid var(--gray-200); border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.1); z-index: 100; padding: 12px; min-width: 200px; }
.filter-dropdown h4 { font-size: 12px; color: var(--gray-500); margin-bottom: 8px; font-weight: 500; }
.filter-dropdown label { display: flex; align-items: center; gap: 6px; padding: 4px 0; font-size: 12px; cursor: pointer; }
.filter-dropdown label input { cursor: pointer; }
.filter-dropdown .filter-actions { display: flex; gap: 8px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--gray-200); }

/* ===== LOADING ===== */
.loading { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--gray-200); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== SETTINGS PANEL ===== */
.settings-panel { display: none; position: fixed; right: 0; top: 0; bottom: 0; width: 360px; background: #fff; box-shadow: -4px 0 24px rgba(0,0,0,0.1); z-index: 200; flex-direction: column; }
.settings-panel.active { display: flex; }
.settings-panel .panel-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--gray-200); }
.settings-panel .panel-header h3 { font-size: 15px; }
.settings-panel .panel-body { flex: 1; overflow: auto; padding: 20px; }
.settings-panel .panel-body .form-group { margin-bottom: 20px; }
.settings-panel .panel-body .form-group label { font-size: 12px; font-weight: 600; color: var(--gray-600); margin-bottom: 6px; display: block; }
.settings-panel .panel-body .form-group input, .settings-panel .panel-body .form-group textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--gray-200); border-radius: 6px; font-size: 13px; }
.settings-panel .panel-body .form-group textarea { font-family: monospace; }
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div class="login-page" id="loginPage">
  <div class="login-card">
    <h1>📊 海外仓总采购表</h1>
    <p class="subtitle">企业级采购管理 · 在线协作表格</p>
    <div id="loginForm">
      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="loginUsername" placeholder="输入用户名" value="admin">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="loginPassword" placeholder="输入密码" value="admin123">
      </div>
      <button class="btn btn-primary btn-block" onclick="doLogin()">登录</button>
      <p style="margin-top:12px;text-align:center;font-size:12px;color:var(--gray-500);">
        没有账号？<a href="#" onclick="showRegister()" style="color:var(--primary)">注册</a>
      </p>
    </div>
    <div id="registerForm" style="display:none">
      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="regUsername" placeholder="输入用户名">
      </div>
      <div class="form-group">
        <label>显示名称</label>
        <input type="text" id="regDisplayName" placeholder="你的名字">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="regPassword" placeholder="设置密码">
      </div>
      <button class="btn btn-primary btn-block" onclick="doRegister()">注册</button>
      <p style="margin-top:12px;text-align:center;font-size:12px;color:var(--gray-500);">
        已有账号？<a href="#" onclick="showLogin()" style="color:var(--primary)">返回登录</a>
      </p>
    </div>
  </div>
</div>

<!-- ===== SPREADSHEET ===== -->
<div class="spreadsheet-app" id="app">
  
  <!-- Toolbar -->
  <div class="toolbar">
    <div class="doc-title" id="docTitle">
      <span>📊 海外仓总采购表</span>
      <input type="text" value="海外仓总采购表" onblur="renameDoc(this.value)">
    </div>
    <span class="star" title="标记星标">☆</span>
    <div class="toolbar-sep"></div>
    <div class="toolbar-group">
      <button class="toolbar-btn" onclick="switchView('products')" title="产品列表"><b>📋</b> 产品</button>
      <button class="toolbar-btn" onclick="switchView('orders')" title="采购单"><b>📄</b> 采购单</button>
      <button class="toolbar-btn" onclick="switchView('ai')" title="AI分析"><b>🤖</b> AI</button>
    </div>
    <div class="toolbar-sep"></div>
    <div class="toolbar-group">
      <button class="toolbar-btn" onclick="showCreateProduct()" title="新增产品"><b>+</b> 新增</button>
      <button class="toolbar-btn" onclick="showImport()" title="导入"><b>↑</b> 导入</button>
      <button class="toolbar-btn" onclick="refreshData()" title="刷新"><b>🔄</b></button>
    </div>
    <div class="toolbar-right">
      <div class="toolbar-group">
        <button class="toolbar-btn" onclick="openSettings()" style="color:var(--gray-400)">⚙️</button>
      </div>
      <div class="user-avatar" id="userAvatar" onclick="toggleUserMenu()" title="用户菜单">管</div>
    </div>
  </div>

  <!-- Formula Bar -->
  <div class="formula-bar" id="formulaBar">
    <div class="cell-ref" id="cellRef">A1</div>
    <span class="fx">fx</span>
    <input class="formula-input" id="formulaInput" placeholder="输入值或公式..." readonly>
  </div>

  <!-- View Switcher (hidden by default, shows non-table views) -->
  <div id="viewContainer" style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
    <!-- Grid View (default) -->
    <div id="gridView" style="flex:1;display:flex;flex-direction:column;">
      <div class="grid-container" id="gridContainer">
        <div class="grid-scroll" id="gridScroll">
          <table class="grid-table" id="gridTable">
            <thead id="gridHeader"></thead>
            <tbody id="gridBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Orders View (hidden) -->
    <div id="ordersView" style="display:none;flex:1;overflow:auto;padding:20px;">
      <div style="margin-bottom:12px;display:flex;align-items:center;gap:8px;">
        <select onchange="loadOrders()" id="orderFilter" style="padding:4px 8px;border:1px solid var(--gray-200);border-radius:4px;">
          <option value="">全部状态</option>
          <option value="待审核">待审核</option>
          <option value="已批准">已批准</option>
          <option value="已下单">已下单</option>
          <option value="已收货">已收货</option>
          <option value="已取消">已取消</option>
        </select>
        <button class="btn btn-primary btn-sm" onclick="showCreateOrder()">+ 新建采购单</button>
      </div>
      <div id="ordersList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;"></div>
    </div>

    <!-- AI View (hidden) -->
    <div id="aiView" style="display:none;flex:1;overflow:auto;padding:20px;">
      <div style="background:#fff;border:1px solid var(--gray-200);border-radius:8px;padding:20px;">
        <h3 style="font-size:15px;margin-bottom:12px;">🤖 AI 智能分析</h3>
        <div style="display:flex;gap:8px;margin-bottom:12px;">
          <input type="text" id="aiQuery" placeholder="输入问题，如：分析低库存商品、建议采购优先级..." style="flex:1;padding:8px 12px;border:1px solid var(--gray-200);border-radius:6px;" onkeydown="if(event.key==='Enter') aiAnalyze()">
          <button class="btn btn-primary" onclick="aiAnalyze()">分析</button>
          <button class="btn btn-outline" onclick="aiSuggestOrder()">建议采购单</button>
        </div>
        <div id="aiResponse" style="padding:16px;background:var(--gray-50);border-radius:6px;font-size:13px;line-height:1.6;white-space:pre-wrap;min-height:60px;">💡 输入问题开始分析，或点击"建议采购单"自动生成补货建议</div>
      </div>
    </div>
  </div>

  <!-- Status Bar -->
  <div class="status-bar">
    <div class="sheet-tabs">
      <span class="sheet-tab active">总表</span>
      <span class="sheet-tab" onclick="switchView('orders')">采购单</span>
      <span class="sheet-tab" onclick="switchView('ai')">AI分析</span>
    </div>
    <div>行数: <span id="rowCount">0</span></div>
    <div class="status-right">
      <span id="lastSync">同步中...</span>
      <span id="userStatus">管理员</span>
    </div>
  </div>
</div>

<!-- ===== MODAL ===== -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">标题</h3>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<!-- ===== SETTINGS PANEL ===== -->
<div class="settings-panel" id="settingsPanel">
  <div class="panel-header">
    <h3>⚙️ 设置</h3>

<!-- ===== TOAST ===== -->
<div class="toast" id="toast"></div>

<script>
// ========== STATE ==========
let TOKEN = localStorage.getItem('token') || '';
let USER = JSON.parse(localStorage.getItem('user') || '{}');
let products = [];
let orders = [];
let currentView = 'products';
let selectedCell = null;
let editingCell = null;
let colWidths = {};
let sortState = {};

// Column definitions matching the uploaded Excel headers
	const COLUMNS = [
	  { key: 'row_num', label: '#', width: 50, editable: false },
	  { key: 'date', label: '日期', width: 80, editable: true },
	  { key: 'attribute', label: '属性', width: 70, editable: true },
	  { key: 'category', label: '组别', width: 80, editable: true },
	  { key: 'store', label: '店铺', width: 80, editable: true },
	  { key: 'mercadolibre_link', label: '美客多产品链接', width: 180, editable: true, type: 'link' },
	  { key: 'purchase_link', label: '原采购链接', width: 180, editable: true, type: 'link' },
	  { key: 'sku', label: 'SKU', width: 140, editable: true },
	  { key: 'product_name', label: '标题', width: 220, editable: true },
	  { key: 'product_attributes', label: '产品属性', width: 120, editable: true },
	  { key: 'purchase_remarks', label: '采购备注', width: 120, editable: true },
	  { key: 'purchase_quantity', label: '采购数量', width: 80, editable: true, type: 'number' },
	  { key: 'warehouse_remarks', label: '仓库备注', width: 120, editable: true },
	  { key: 'order_number', label: '订单号', width: 160, editable: true },
	  { key: 'purchase_price', label: '采购价RMB', width: 100, editable: true, type: 'number' },
	  { key: 'new_purchase_price', label: '新采购价RMB', width: 100, editable: true, type: 'number' },
	  { key: 'new_purchase_link', label: '新采购链接', width: 180, editable: true, type: 'link' },
	  { key: 'supplier', label: '供应商', width: 140, editable: true },
	  { key: 'image_url', label: '图片', width: 70, editable: true, type: 'image' },
	  { key: 'stock_quantity', label: '库存', width: 70, editable: true, type: 'number' },
	  { key: 'remark1', label: '备注1', width: 120, editable: true },
	  { key: 'remark2', label: '备注2', width: 120, editable: true },
	  { key: 'remark3', label: '备注3', width: 120, editable: true },
	  { key: 'remark4', label: '备注4', width: 120, editable: true },
	  { key: 'length', label: '长', width: 70, editable: true, type: 'number' },
	  { key: 'width', label: '宽', width: 70, editable: true, type: 'number' },
	  { key: 'height', label: '高', width: 70, editable: true, type: 'number' },
	];

// ========== AUTH ==========
function doLogin() {
  const u = document.getElementById('loginUsername').value;
  const p = document.getElementById('loginPassword').value;
  fetch('/api/auth/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:u, password:p})})
  .then(r=>r.json()).then(d=>{
    if (d.token) {
      TOKEN = d.token; USER = d.user;
      localStorage.setItem('token', TOKEN); localStorage.setItem('user', JSON.stringify(USER));
      showApp();
    } else toast(d.detail||'登录失败', 'error');
  }).catch(()=>toast('网络错误', 'error'));
}

function doRegister() {
  const u = document.getElementById('regUsername').value;
  const p = document.getElementById('regPassword').value;
  const n = document.getElementById('regDisplayName').value || u;
  fetch('/api/auth/register', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:u, password:p, display_name:n})})
  .then(r=>r.json()).then(d=>{
    if (d.token) { TOKEN = d.token; USER = d.user; localStorage.setItem('token', TOKEN); localStorage.setItem('user', JSON.stringify(USER)); showApp(); }
    else toast(d.detail||'注册失败', 'error');
  });
}

function doLogout() {
  localStorage.removeItem('token'); localStorage.removeItem('user');
  TOKEN = ''; USER = {};
  document.getElementById('app').classList.remove('active');
  document.getElementById('loginPage').style.display = 'flex';
  closeSettings();
}

function showRegister() { document.getElementById('loginForm').style.display='none'; document.getElementById('registerForm').style.display='block'; }
function showLogin() { document.getElementById('loginForm').style.display='block'; document.getElementById('registerForm').style.display='none'; }

function authHeaders() {
  return TOKEN ? {'Authorization': `Bearer ${TOKEN}`, 'Content-Type': 'application/json'} : {'Content-Type': 'application/json'};
}

// ========== APP ==========
function showApp() {
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('app').classList.add('active');
  const n = USER.display_name || USER.username;
  document.getElementById('userAvatar').textContent = n[0];
  document.getElementById('settingsAvatar').textContent = n[0];
  document.getElementById('settingsUserName').textContent = n;
  document.getElementById('settingsUserRole').textContent = USER.role;
  document.getElementById('userStatus').textContent = n;
  loadData();
}

// ========== DATA ==========
async function loadData() {
  try {
    document.getElementById('lastSync').textContent = '同步中...';
    const data = await api(`/api/products?page_size=200`);
    products = data.items;
    document.getElementById('rowCount').textContent = products.length;
    renderGrid();
    document.getElementById('lastSync').textContent = `最后更新: ${new Date().toLocaleTimeString()}`;
  } catch(e) {
    toast('加载失败: '+e.message, 'error');
    document.getElementById('lastSync').textContent = '同步失败';
  }
}

function refreshData() { loadData(); }

async function api(url, method='GET', body=null) {
  const opts = {method, headers: authHeaders()};
  if (body) opts.body = JSON.stringify(body);
  const resp = await fetch(url, opts);
  if (resp.status === 401) {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    TOKEN = ''; USER = {};
    if (document.getElementById('app').classList.contains('active')) {
      document.getElementById('app').classList.remove('active');
      document.getElementById('loginPage').style.display = 'flex';
    }
    throw new Error('请先登录');
  }
  const data = await resp.json();
  if (!resp.ok) throw new Error(data.detail || '请求失败');
  return data;
}

// ========== GRID ==========
function renderGrid() {
  const header = document.getElementById('gridHeader');
  const body = document.getElementById('gridBody');

  // Build header
  let hHtml = '<tr>';
  COLUMNS.forEach((col, i) => {
    hHtml += `<th class="col-header" style="min-width:${col.width}px;max-width:${col.width}px;width:${col.width}px;position:relative;">
      ${col.label}
      <span class="filter-icon" onclick="showFilter(${i})" title="筛选">▼</span>
      <span class="resize-handle" onmousedown="startResize(event, ${i})"></span>
    </th>`;
  });
  hHtml += '</tr>';
  header.innerHTML = hHtml;

  // Build body
  if (!products.length) {
    body.innerHTML = `<tr><td colspan="${COLUMNS.length}" style="text-align:center;padding:40px;color:var(--gray-400);">暂无数据，点击工具栏"新增"添加产品</td></tr>`;
    return;
  }

  let bHtml = '';
  products.forEach((p, rowIdx) => {
    bHtml += '<tr>';
    COLUMNS.forEach((col, colIdx) => {
      if (col.key === 'row_num') {
        bHtml += `<td class="row-num">${rowIdx + 1}</td>`;
        return;
      }
      let val = p[col.key];
      let cls = 'cell';
      let content = '';

      if (val === null || val === undefined || val === '') {
	        content = '';
	      } else if (col.key === 'status') {
	        const statusMap = {'待采购':'pending','已下单':'ordered','在途':'transit','已入库':'warehoused','停售':'discontinued'};
	        const sc = statusMap[val] || 'pending';
	        content = `<span class="status-dot" style="background:${sc==='pending'?'#f59e0b':sc==='ordered'?'#3b82f6':sc==='transit'?'#8b5cf6':sc==='warehoused'?'#22c55e':'#9ca3af'}"></span><span class="status-${sc}">${escHtml(val)}</span>`;
	      } else if (col.key === 'image_url') {
	        content = val ? `<img src="${escHtml(val)}" class="img-thumb" onerror="this.style.display='none'">` : '';
	      } else if (col.type === 'link' && val) {
	        content = `<a href="${escHtml(val)}" target="_blank" class="cell-link">${val.length > 30 ? val.slice(0,30)+'...' : val}</a>`;
	      } else if (col.type === 'number') {
	        const num = Number(val);
	        if (Number.isInteger(num) && Math.abs(num) < 100000) {
	          content = `<span class="cell-content num">${num}</span>`;
	        } else {
	          content = `<span class="cell-content num">${num.toFixed(2)}</span>`;
	        }
	      } else {
        content = escHtml(String(val));
      }

      bHtml += `<td class="${cls}" data-row="${rowIdx}" data-col="${colIdx}" data-key="${col.key}" data-id="${p.id}" onclick="selectCell(this)">
        <div class="cell-content${col.type==='number'?' num':''}">${content}</div>
        <input class="cell-edit" onblur="finishEdit(this)" onkeydown="if(event.key==='Enter')this.blur();if(event.key==='Escape'){this.value=this.dataset.old;this.blur()}">
      </td>`;
    });
    bHtml += '</tr>';
  });
  body.innerHTML = bHtml;
}

function selectCell(el) {
  if (selectedCell) selectedCell.classList.remove('selected');
  selectedCell = el;
  el.classList.add('selected');
  const row = parseInt(el.dataset.row) + 1;
  const col = String.fromCharCode(65 + parseInt(el.dataset.col));
  document.getElementById('cellRef').textContent = `${col}${row}`;
  const content = el.querySelector('.cell-content');
  document.getElementById('formulaInput').value = content ? content.textContent.trim() : '';
}

function startEdit(el) {
  if (editingCell) finishEdit(editingCell.querySelector('.cell-edit'));
  const editInput = el.querySelector('.cell-edit');
  const content = el.querySelector('.cell-content');
  const key = el.dataset.key;
  if (!editInput || !key || !COLUMNS.find(c=>c.key===key)?.editable) return;
  
  editInput.value = content.textContent.trim();
  editInput.dataset.old = editInput.value;
  content.classList.add('editing');
  editInput.classList.add('active');
  editInput.focus();
  editInput.select();
  editingCell = el;
  document.getElementById('formulaInput').value = editInput.value;
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && selectedCell && !editingCell) {
    e.preventDefault();
    startEdit(selectedCell);
  }
  if (e.key === 'Tab' && selectedCell) {
    e.preventDefault();
    const col = parseInt(selectedCell.dataset.col);
    const row = parseInt(selectedCell.dataset.row);
    const next = document.querySelector(`td[data-row="${row}"][data-col="${col+1}"]`);
    if (next) { selectCell(next); if (editingCell) startEdit(next); }
  }
  if (e.key === 'ArrowDown' && selectedCell) {
    e.preventDefault();
    const col = parseInt(selectedCell.dataset.col);
    const row = parseInt(selectedCell.dataset.row);
    const next = document.querySelector(`td[data-row="${row+1}"][data-col="${col}"]`);
    if (next) selectCell(next);
  }
  if (e.key === 'ArrowUp' && selectedCell) {
    e.preventDefault();
    const col = parseInt(selectedCell.dataset.col);
    const row = parseInt(selectedCell.dataset.row);
    const next = document.querySelector(`td[data-row="${row-1}"][data-col="${col}"]`);
    if (next) selectCell(next);
  }
});

function finishEdit(input) {
  if (!editingCell) return;
  const content = editingCell.querySelector('.cell-content');
  const newVal = input.value;
  input.classList.remove('active');
  content.classList.remove('editing');
  editingCell = null;
  
  if (newVal !== input.dataset.old) {
    const id = parseInt(editingCell.dataset.id);
    const key = editingCell.dataset.key;
    const field = key;
    let val = newVal;
    const col = COLUMNS.find(c => c.key === key);
    if (col && col.type === 'number') val = parseFloat(val) || 0;
    if (key === 'status') {
      quickEdit(id, field, val);
      content.innerHTML = `<span class="status-dot" style="background:${val==='待采购'?'#f59e0b':val==='已下单'?'#3b82f6':val==='在途'?'#8b5cf6':val==='已入库'?'#22c55e':'#9ca3af'}"></span>${val}`;
    } else {
      quickEdit(id, field, val);
      content.textContent = val;
    }
  }
}

async function quickEdit(id, field, value) {
  try {
    await api(`/api/products/${id}`, 'PUT', {[field]: value});
    document.getElementById('lastSync').textContent = `已保存 ${new Date().toLocaleTimeString()}`;
  } catch(e) {
    toast('保存失败: '+e.message, 'error');
  }
}

// ========== COLUMN RESIZE ==========
let resizeCol = null;
function startResize(e, colIdx) {
  resizeCol = colIdx;
  document.addEventListener('mousemove', doResize);
  document.addEventListener('mouseup', stopResize);
  e.preventDefault();
}
function doResize(e) {
  if (resizeCol === null) return;
  const ths = document.querySelectorAll('.col-header');
  const th = ths[resizeCol];
  if (!th) return;
  const rect = th.getBoundingClientRect();
  const newW = Math.max(50, e.clientX - rect.left);
  th.style.width = newW + 'px';
  th.style.minWidth = newW + 'px';
  th.style.maxWidth = newW + 'px';
  COLUMNS[resizeCol].width = newW;
  // Update all cells in this column
  document.querySelectorAll(`td[data-col="${resizeCol}"]`).forEach(td => {
    td.style.minWidth = newW + 'px';
    td.style.maxWidth = newW + 'px';
    td.style.width = newW + 'px';
  });
}
function stopResize() {
  resizeCol = null;
  document.removeEventListener('mousemove', doResize);
  document.removeEventListener('mouseup', stopResize);
}

// ========== VIEW SWITCH ==========
function switchView(view) {
  currentView = view;
  document.getElementById('gridView').style.display = view === 'products' ? 'flex' : 'none';
  document.getElementById('ordersView').style.display = view === 'orders' ? 'block' : 'none';
  document.getElementById('aiView').style.display = view === 'ai' ? 'block' : 'none';
  document.querySelectorAll('.sheet-tab').forEach(t => t.classList.remove('active'));
  const tabs = document.querySelectorAll('.sheet-tab');
  if (view === 'products') tabs[0].classList.add('active');
  else if (view === 'orders') tabs[1].classList.add('active');
  else if (view === 'ai') tabs[2].classList.add('active');
  if (view === 'orders') loadOrders();
}

// ========== ORDERS ==========
async function loadOrders() {
  try {
    const status = document.getElementById('orderFilter').value;
    const data = await api(`/api/orders?page_size=50&status=${encodeURIComponent(status)}`);
    const list = document.getElementById('ordersList');
    if (!data.items.length) {
      list.innerHTML = '<div style="text-align:center;padding:40px;color:var(--gray-400);">暂无采购单</div>';
      return;
    }
    list.innerHTML = data.items.map(o => `
      <div style="background:#fff;border:1px solid var(--gray-200);border-radius:8px;padding:16px;">
        <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
          <span style="font-weight:600;font-size:14px;">${o.order_number}</span>
          <span style="font-size:12px;padding:2px 8px;border-radius:10px;background:${o.status==='待审核'?'#fef3c7':o.status==='已批准'?'#dbeafe':'#d1fae5'};color:${o.status==='待审核'?'#92400e':o.status==='已批准'?'#1e40af':'#065f46'}">${o.status}</span>
        </div>
        <div style="font-size:12px;color:var(--gray-500);">
          <div>供应商: ${o.supplier || '-'}</div>
          <div>金额: ¥${o.total_amount.toFixed(2)}</div>
          <div>商品数: ${o.item_count} 项</div>
          <div>${o.created_by} | ${new Date(o.created_at).toLocaleDateString()}</div>
        </div>
      </div>
    `).join('');
  } catch(e) {
    document.getElementById('ordersList').innerHTML = '<div style="text-align:center;padding:40px;color:var(--danger);">加载失败</div>';
  }
}

  document.getElementById('modalTitle').textContent = '新建采购单';
  document.getElementById('modalBody').innerHTML = `

    <div class="form-group"><label>备注</label><textarea id="o_notes" rows="2" style="width:100%"></textarea></div>
    <div style="font-size:12px;color:var(--gray-500);margin-bottom:8px;">商品列表</div>
    <div id="orderItems">
      <div class="form-row" style="margin-bottom:6px;">
        <input placeholder="SKU" class="oi-sku" style="padding:6px 8px;border:1px solid var(--gray-200);border-radius:4px;">
        <input type="number" placeholder="数量" class="oi-qty" style="width:80px;padding:6px 8px;border:1px solid var(--gray-200);border-radius:4px;" value="1">

function addOrderItem() {
  const div = document.createElement('div');
  div.className = 'form-row';
  div.style.marginBottom = '6px';
  div.innerHTML = `
    <input placeholder="SKU" class="oi-sku" style="padding:6px 8px;border:1px solid var(--gray-200);border-radius:4px;">
    <input type="number" placeholder="数量" class="oi-qty" style="width:80px;padding:6px 8px;border:1px solid var(--gray-200);border-radius:4px;" value="1">
    <input type="number" step="0.01" placeholder="单价" class="oi-price" style="width:100px;padding:6px 8px;border:1px solid var(--gray-200);border-radius:4px;" value="0">
    <button class="btn btn-sm" style="background:var(--danger);color:#fff;border:none;padding:6px 10px;border-radius:4px;cursor:pointer;" onclick="this.parentElement.remove()">×</button>
  `;
  document.getElementById('orderItems').appendChild(div);
}

async function submitCreateOrder() {
  const items = [];
  document.querySelectorAll('.oi-sku').forEach((el, i) => {
    const sku = el.value.trim();
    if (!sku) return;
    const qty = parseInt(document.querySelectorAll('.oi-qty')[i].value) || 1;
    const price = parseFloat(document.querySelectorAll('.oi-price')[i].value) || 0;
    items.push({product_name: sku, sku, quantity: qty, unit_price: price});
  });
  if (!items.length) { toast('请至少添加一个商品', 'error'); return; }
  try {
    await api('/api/orders', 'POST', {
      supplier: document.getElementById('o_supplier').value,
      notes: document.getElementById('o_notes').value,
      items
    });
    toast('采购单创建成功', 'success');
    closeModal();
    loadOrders();
  } catch(e) { toast(e.message, 'error'); }
}

// ========== AI ==========
async function aiAnalyze() {
  const q = document.getElementById('aiQuery').value;
  if (!q) { toast('请输入问题', 'error'); return; }
  document.getElementById('aiResponse').innerHTML = '<span class="loading"></span> 分析中...';
  try {
    const d = await api('/api/ai/analyze', 'POST', {query: q});
    document.getElementById('aiResponse').innerHTML = d.reply || '暂无分析结果';
  } catch(e) { document.getElementById('aiResponse').innerHTML = '分析失败: '+e.message; }
}

async function aiSuggestOrder() {
  document.getElementById('aiResponse').innerHTML = '<span class="loading"></span> 生成建议中...';
  try {
    const d = await api('/api/ai/suggest-order', 'POST');
    let html = '💡 AI采购建议\n\n';
    if (d.items && d.items.length) {
      d.items.forEach(i => { html += `- ${i.sku}: 建议采购 ${i.suggested_quantity} 个\n  理由: ${i.reason || '库存不足'}\n`; });
    } else html += d.message || '暂无建议';
    document.getElementById('aiResponse').innerHTML = html;
  } catch(e) { document.getElementById('aiResponse').innerHTML = '生成失败: '+e.message; }
}

function showImport() {
  document.getElementById('modalTitle').textContent = '导入数据';
  document.getElementById('modalBody').innerHTML = `
    <div style="margin-bottom:16px;">
      <p style="font-size:13px;color:var(--gray-500);margin-bottom:8px;">方式一：上传Excel文件（.xlsx，表头自动匹配）</p>
      <input type="file" id="excelFileInput" accept=".xlsx" style="font-size:13px;">
      <button class="btn btn-primary btn-sm" onclick="uploadExcel()" style="margin-top:8px;">上传并导入</button>
    </div>
    <div style="border-top:1px solid var(--gray-200);padding-top:16px;">
      <p style="font-size:13px;color:var(--gray-500);margin-bottom:8px;">方式二：粘贴JSON数据</p>
      <textarea id="importData" rows="8" style="width:100%;font-family:monospace;font-size:12px;padding:8px;border:1px solid var(--gray-200);border-radius:6px;" placeholder='[{"sku":"...","product_name":"...","date":"46093","attribute":"补货","category":"美一组","purchase_price":15.5,...}]'></textarea>
      <div style="margin-top:8px;font-size:12px;color:var(--gray-400);">支持字段: date, attribute, category, store, mercadolibre_link, purchase_link, sku, product_name, product_attributes, purchase_remarks, purchase_quantity, warehouse_remarks, order_number, purchase_price, new_purchase_price, new_purchase_link, supplier, image_url, stock_quantity, remark1-4, length, width, height</div>
    </div>
  `;
  document.getElementById('modalFooter').innerHTML = `
    <button class="btn btn-outline" onclick="closeModal()">取消</button>
    <button class="btn btn-primary" onclick="submitImport()">导入JSON</button>
  `;
  document.getElementById('modalOverlay').classList.add('active');
}

async function uploadExcel() {
  const fileInput = document.getElementById('excelFileInput');
  if (!fileInput.files.length) { toast('请选择Excel文件', 'error'); return; }
  const formData = new FormData();
  formData.append('file', fileInput.files[0]);
  try {
    const resp = await fetch('/api/products/upload-excel', {
      method: 'POST',
      headers: {'Authorization': `Bearer ${TOKEN}`},
      body: formData,
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || '上传失败');
    toast(data.message, 'success');
    closeModal();
    loadData();
  } catch(e) { toast('上传失败: '+e.message, 'error'); }
}

async function submitImport() {
  const raw = document.getElementById('importData').value.trim();
  if (!raw) { toast('请粘贴数据', 'error'); return; }
  try {
    const data = JSON.parse(raw);
    if (!Array.isArray(data)) throw new Error('数据必须是数组');
    const r = await api('/api/products/import', 'POST', data);
    toast(r.message, 'success');
    closeModal();
    loadData();
  } catch(e) { toast('导入失败: '+e.message, 'error'); }
}

}

// ========== FILTER ==========
function showFilter(colIdx) {
  // Simple filter by status/category
  const col = COLUMNS[colIdx];
  if (col.key === 'status') {
    const vals = [...new Set(products.map(p => p.status))];
    // Just show a quick switch
    const current = document.getElementById('statusFilter')?.value || '';
    const newVal = current === '待采购' ? '' : '待采购';
    // Simple toggle
    if (col.key === 'status') {
      if (!document.getElementById('statusFilter')) {
        const input = document.createElement('input');
        input.id = 'statusFilter';
        input.type = 'hidden';
        input.value = '待采购';
        document.body.appendChild(input);
      }
      const f = document.getElementById('statusFilter');
      f.value = f.value ? '' : '待采购';
      filterByStatus(f.value);
    }
  }
}

function filterByStatus(status) {
  if (!status) {
    loadData();
    return;
  }
  // Filter products client-side
  const filtered = products.filter(p => p.status === status);
  const oldProducts = products;
  products = filtered;
  renderGrid();
  products = oldProducts;
}

// ========== TOAST ==========
function toast(msg, type='info') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast ${type}`;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

// ========== UTILS ==========
function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
